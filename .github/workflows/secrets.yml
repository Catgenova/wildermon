# No secret goes into the repository unnoticed.
#
# Gitleaks over every push, from its release binary with the checksum checked:
# the commits the push brought (the whole history when there is nothing to
# count from), and the whole history once a week and on demand. What is public
# by design, such as the Supabase publishable key, is let through by
# .gitleaks.toml. A finding fails the run; the secret it names has to be
# revoked and replaced, since taking it out of the next commit leaves it in
# history.
name: Secrets

on:
  push:
    # The backups branch holds copies of the database and is pushed by the
    # backup workflow's own token, which starts no workflow anyway.
    branches-ignore: [backups]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: No secret in what was pushed
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # gitleaks_8.30.1_checksums.txt, gitleaks_8.30.1_linux_x64.tar.gz
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks, checksum checked
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.sha }}
        run: |
          range=""
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [[ ! "$BEFORE" =~ ^0+$ ]] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          elif [ "$EVENT" = pull_request ] && [ -n "$BASE" ]; then
            range="$BASE..$AFTER"
          fi
          echo "Scanning ${range:-the whole history}."
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            ${range:+--log-opts="$range"} .
