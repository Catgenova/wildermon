# One fixed repair to the live island, run by hand. It writes; look.yml only reads.
#
# Asked about: "telestone is bugged. Immediately return player catgenova to position 3558, 937". A Telestone took
# catgenova to a Runestone with no way back. This puts their body on the ground at the middle of tile (3558, 937).
name: Mend the island

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mend:
    name: One repair
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # Pinned: CLI 3.0 (2026-11-02) targets the local stack unless a command
          # says --remote, and asks before writing to a hosted database. Every
          # command here is written for 2.x, where --linked is the project.
          version: 2.122.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Mend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db query --linked "
            update player p set x = 3558.5, y = 937.5, level = 0, moved_at = now(), seen_at = now(), away = false
             where p.name = 'catgenova'
            returning p.name, p.x, p.y, p.level"
