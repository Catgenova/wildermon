# The island, checked three ways.
#
# `rules` needs nothing and runs on every push: a Postgres of its own, built
# from the migrations in this repo, with the whole suite over it, in six shards
# side by side. That is the one that catches things, and it costs no secrets
# and no project. A live run skips it when the same code has passed it already
# (`already`).
#
# `migrate` and `smoke` touch the real project and so need credentials. They
# exist because there are things no local database can tell you: whether
# anonymous sign-in is switched on, whether Realtime is publishing, whether the
# policies behave the same behind PostgREST as behind psql, and whether eight
# megabytes of island survives the trip.
name: Island

# The paths are the whole of `src`, which they were not. They used to be
# `supabase/**` and `src/net/**`, from when everything in this suite was about
# the island and the wire. That has not been true for a while: half the tests
# under `supabase/test/` now measure browser code — what a beast is drawn
# turned to, what a building shelters, what a job sounds like — and a change
# to `src/render/sprites.ts` that broke `turned.ts` would have gone through
# without the suite running at all.
on:
  push:
    paths:
      - 'supabase/**'
      - 'src/**'
      - '.github/workflows/island.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/**'
  workflow_dispatch:
    inputs:
      live:
        description: 'Also push migrations to the project and smoke-test it'
        type: boolean
        default: false
      found:
        description: 'Found a new island on the project and open it'
        type: boolean
        default: false
      size:
        description: 'How many tiles a side the new island is'
        default: '4096'
      island_name:
        description: 'What the new island is called'
        default: 'Wildermon'
      seed:
        description: 'Its seed; blank rolls one'
        default: ''
      reconcile:
        description: 'Put the island and the browsers back on the same ground'
        type: choice
        options: ['off', 'report', 'write']
        default: 'off'

# Reads the repository and nothing else: no job here pushes, deploys or comments.
# The project is reached with the AI environment's secrets, not this token.
permissions:
  contents: read

jobs:
  # Asked for: a live run that does not test again what has passed already. A live run looks for a run of this
  # workflow over the same code (the commit's tree but for the built site, which `build-site.yml` makes from it):
  # waits for one still going, and when one has passed, the rules are not run again and the migrations go straight
  # out. Otherwise, or on any doubt, the rules run here as on a push (`scripts/ci-tested.sh`).
  already:
    name: Whether this code has passed already
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.look.outputs.tested }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 200
      - name: Look for a run over the same code
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-tested.sh

  # Asked for: the suite in a quarter of the time. It runs as six shards side by side, each with a Postgres of its
  # own built the same way (`run.sh`). The tests are in supabase/test/manifest.json, each naming its shard, and one
  # step a shard runs them all (`run-all.mjs`): bundled in one esbuild build, run in order, a failure not stopping
  # the rest, a table at the end, and each test's seconds uploaded (`test-durations-N`) for
  # `run-all.mjs --rebalance`. A new test is a manifest entry; the steps here are the checks that are not one test.
  rules:
    name: The rules, against a Postgres of our own (${{ matrix.shard }} of 6)
    needs: already
    if: ${{ !cancelled() && needs.already.outputs.tested != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wildermon
          POSTGRES_PASSWORD: wildermon
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: wildermon
      PGPASSWORD: wildermon
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: The built page starts
        if: matrix.shard == 1
        env:
          # A check that cannot open a browser here fails rather than passes.
          BOOT_CHECK_STRICT: '1'
        run: |
          # The page players get is the one Vite built into index.html and
          # assets/, whose modules run in the order Rolldown chooses, and no
          # other check here loads it. A ring of imports once made that order
          # run actions.ts before baubles.ts, so the page threw as it loaded
          # and stood on "Raising an island..." for everybody, with every test
          # green. This opens the committed build in Chrome, starts the game
          # on its own and the landing page, and fails on anything thrown.
          node scripts/boot-check.mjs
      - name: Coming ashore in phases, and coming back after a cut
        if: matrix.shard == 1
        env:
          BOOT_CHECK_STRICT: '1'
        run: |
          # The boot bar is the phases of coming ashore (src/ui/bootsteps.ts),
          # each its share, moved only by the work: it only grows, fills, and
          # passes through the phases in order. A cut live connection is come
          # back from without a join: the socket opened at once rather than
          # after Phoenix's backoff (which held a cut socket and ignored
          # connect, so a page back on the network waited up to 10 s), the
          # channels joined again, and only what changed read. Then the built
          # page against a stand-in island: first frame timed, the network cut
          # for 4 s and the socket alone dropped, each playable again within
          # 2.5 s with the tile changed meanwhile laid.
          npx esbuild supabase/test/bootsteps.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/bootsteps.mjs --log-level=error
          node node_modules/.cache/bootsteps.mjs
          node scripts/login-check.mjs
      - name: Every HTML sink in src has been looked at
        if: matrix.shard == 1
        run: |
          # innerHTML and its kin run whatever markup they are handed, so a
          # player's name or a line of chat that reaches one unescaped runs in
          # everybody's browser. This lists every such sink in src/ and fails
          # on one that is not in scripts/html-sinks.allow, the list of sinks
          # somebody has read: new text goes through esc() (src/ui/esc.ts) or
          # in as textContent, and then onto the list.
          node scripts/html-sinks.mjs
      - name: No migration has been deleted or renamed
        if: matrix.shard == 1
        run: |
          # A migration the project has already run is a fact about its
          # history, and the CLI refuses to push when the remote holds a
          # version the repository has forgotten: "Remote migration versions
          # not found in local migrations directory". Replacing a function
          # means a NEW migration, never an edited or renamed one.
          # A file may go only when another still carries its version (a
          # duplicate version, which the project holds once).
          gone=""
          for f in $(git diff --diff-filter=DR --name-only HEAD~1 HEAD -- supabase/migrations/ || true); do
            v=$(basename "$f" | cut -c1-14)
            ls supabase/migrations/"$v"_*.sql >/dev/null 2>&1 || gone="$gone $f"
          done
          if [ -n "$gone" ]; then
            echo "::error::These migrations were deleted or renamed, which will break 'supabase db push':"
            echo "$gone"
            exit 1
          fi
          echo "no migrations removed"
      - name: No two migrations share a version
        if: matrix.shard == 1
        run: |
          # The project keys its history by the 14-digit stamp alone, so two
          # files under one stamp fail the push: "duplicate key value violates
          # unique constraint schema_migrations_pkey".
          dup=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -c1-14 | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::More than one migration under each of these versions:"
            for v in $dup; do ls supabase/migrations/"$v"_*.sql; done
            exit 1
          fi
          echo "every migration version is its own"
      - name: No migration has been added out of order
        if: matrix.shard == 1
        run: |
          # Append-only is not only about editing: a migration added *before*
          # one the project has already run is one the CLI will refuse to push
          # ("Found local migration files to be inserted before the last
          # migration on remote database"). The generated definitions carry a
          # wall-clock stamp and the hand-written ones carry one chosen by
          # hand, so the two can cross. Caught here, it is a rename away from
          # fixed; caught at the project, it is a failed deploy.
          last=$(git ls-tree -r --name-only HEAD~1 -- supabase/migrations/ \
                 | xargs -r -n1 basename | sort | tail -1)
          added=$(git diff --diff-filter=A --name-only HEAD~1 HEAD -- supabase/migrations/ \
                  | xargs -r -n1 basename | sort)
          bad=""
          for m in $added; do
            [ -z "$last" ] && break
            if [ "$m" \< "$last" ]; then bad="$bad $m"; fi
          done
          if [ -n "$bad" ]; then
            echo "::error::These migrations sort before '$last', which the project may already have run:$bad"
            echo "::error::Rename them to a later timestamp before they reach the project."
            exit 1
          fi
          echo "nothing added out of order (latest before this commit: ${last:-none})"
      - name: No migration alters or empties a table without a lock timeout
        if: matrix.shard == 1
        run: |
          # `alter table` wants ACCESS EXCLUSIVE, and the moment it starts
          # waiting for one, every query behind it waits too -- so an ALTER on
          # a table the doors write to can stop the island dead for as long as
          # one open transaction holds a row. `lock_timeout` turns that from an
          # unbounded stall into a failed deploy, which is the cheaper of the
          # two. This looks only at statements: prose about an ALTER in a
          # comment starts with `--` or ` *`, never at the margin.
          #
          # `truncate` is in here because it wants the same lock and a deploy
          # died on one: the definitions snapshot empties the rulebook tables
          # to refill them, and it asked for `tile_def` at 13:00:30 UTC, which
          # is the minute the daily tree pass holds the woods open.
          added=$(git diff --diff-filter=AM --name-only HEAD~1 HEAD -- supabase/migrations/ || true)
          bad=""
          for m in $added; do
            [ -f "$m" ] || continue
            grep -Eiq '^[[:space:]]*((alter|drop)[[:space:]]+table|truncate[[:space:]])' "$m" || continue
            grep -q 'lock_timeout' "$m" || bad="$bad $m"
          done
          if [ -n "$bad" ]; then
            echo "::error::These migrations alter or empty a table with no lock timeout in front of it:$bad"
            echo "::error::Put \"set local lock_timeout = '3s';\" at the top of the file."
            exit 1
          fi
          echo "every migration that wants a table's lock bounds its wait"
          # And a wait it steps back from is still a wait, which is how the
          # *next* deploy died: `truncate a, b, c` takes its locks one at a
          # time and holds each while it asks for the next, so an island query
          # holding `tile_def` and wanting `item_def` closes a ring round it.
          # A deadlock is 40P01 and a timeout is 55P03; catching one and not
          # the other made a ring a dead deploy where a wait was a retry. If a
          # migration handles either, it handles both.
          bad=""
          for m in $added; do
            [ -f "$m" ] || continue
            grep -q 'lock_not_available' "$m" || continue
            grep -q 'deadlock_detected' "$m" || bad="$bad $m"
          done
          if [ -n "$bad" ]; then
            echo "::error::These migrations retry on a lock timeout but die on a deadlock:$bad"
            echo "::error::Catch both: \"exception when lock_not_available or deadlock_detected then\"."
            exit 1
          fi
          echo "and a migration that steps back from a wait steps back from a ring too"
          # `supabase db push` applies every migration over one session, so a
          # `pg_temp` helper made by one is still there for the next: a plain
          # `create function pg_temp.patch_fn` in the second dies with 42723
          # (live run 41514665853, at 20261102180001). Make them replaceable.
          bad=""
          for m in $added; do
            [ -f "$m" ] || continue
            grep -Eiq '^[[:space:]]*create[[:space:]]+function[[:space:]]+pg_temp\.' "$m" && bad="$bad $m"
          done
          if [ -n "$bad" ]; then
            echo "::error::These migrations make a pg_temp function that an earlier one in the same push may have made:$bad"
            echo "::error::Write \"create or replace function pg_temp.…\"."
            exit 1
          fi
          echo "and a pg_temp helper may be made again in the same push"
      # `git diff` cannot see a file that is not tracked yet, and a fresh
      # `_defs.sql` is exactly that — so the old form of this check would have
      # let a brand new definitions migration through without noticing. Asking
      # `git status` about the whole directory catches both.
      - name: The definitions are still what the TypeScript says
        if: matrix.shard == 1
        run: |
          # The bundle of every migration (`npm run db:bundle`) is past the
          # hundred megabytes GitHub keeps in one file, so it is written on
          # demand and not committed; nothing here is asked of it.
          npm run defs
          dirty=$(git status --porcelain supabase/migrations supabase/defs-state.sql)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            echo "::error::The generated SQL is out of date. Run 'npm run defs' and 'npm run build', and commit what they write."
            exit 1
          fi
      # The live test is eight hundred lines that nothing typechecked: `tsconfig`
      # covered `src` and no more, so `smoke.ts` was first compiled by esbuild
      # inside the live job — after the migrations had been pushed to the real
      # project. A duplicate variable took a run down three minutes in.
      - name: The tests and tools that run outside a browser still compile
        if: matrix.shard == 1
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Joining, refusing, digging, settling and who may write what
        id: db
        if: ${{ !cancelled() }}
        run: supabase/test/run.sh
      - name: The suite, shard ${{ matrix.shard }} of 6
        id: suite
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: node supabase/test/run-all.mjs --shard ${{ matrix.shard }}/6 --durations test-durations/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: test-durations-${{ matrix.shard }}
          path: test-durations/
          if-no-files-found: ignore
      - name: The builds the island takes, input timing on the watch, and the doors around them
        if: ${{ !cancelled() && steps.db.outcome == 'success' && matrix.shard == 3 }}
        env:
          # A check that cannot open a browser here fails rather than passes.
          BOOT_CHECK_STRICT: '1'
        run: |
          # The join refuses a build the deploy did not hand over, unless the
          # island has none, it was retired within the hour, it is of a later
          # deploy, or the check fails; the words are the page's. The browser's
          # count of its own clicks and keys, held to the island's lines, raises
          # an input flag on the watch once a day per body and nothing else.
          # And with them, the page and the doors they sit beside: the built
          # page starts with its names renamed and its wire code obfuscated,
          # everything typechecks, and the accounts, watch and keeper tests.
          npm run typecheck
          node scripts/boot-check.mjs
          for t in build inputwatch accounts watch keeper; do
            npx esbuild supabase/test/$t.ts --bundle --platform=node --format=esm \
              --external:typescript --outfile=node_modules/.cache/s3-$t.mjs --log-level=error
            node node_modules/.cache/s3-$t.mjs
          done
      - name: A walk onto Solara Manor's storey-4 bridge finds its way, from the ground and every storey
        if: ${{ !cancelled() && matrix.shard == 3 }}
        run: |
          # The island's own layout of the manor's two buildings, their floors,
          # walls and the ground round them (manorbridge.json), with its
          # three-lane bridge at storey 4: from the ground east of it and from
          # each building on each storey, pinned on storey 4 and on Auto, a walk
          # reaches every tile of the deck. Before the deck counted as somewhere
          # a walk on a pinned storey ends, every one past its first column was
          # "No path there.".
          npx esbuild supabase/test/manorbridge.ts --bundle --platform=node --format=esm --packages=external \
            --outfile=node_modules/.cache/manorbridge.mjs --log-level=error
          cp supabase/test/manorbridge.json node_modules/.cache/
          node node_modules/.cache/manorbridge.mjs

  migrate:
    name: Push the migrations to the project
    # On the rules having passed here, or over the same code already (`already`).
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.live && (needs.already.outputs.tested == 'true' || needs.rules.result == 'success') }}
    needs: [already, rules]
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so the build this job makes for "The builds the island takes" counts
          # the same deploy number as the "Build site" workflow's.
          fetch-depth: 0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        id: cli
        continue-on-error: true
        with:
          # Pinned: CLI 3.0 (2026-11-02) targets the local stack unless a command
          # says --remote, and asks before writing to a hosted database. Every
          # command here is written for 2.x, where --linked is the project.
          version: 2.122.1
        env:
          # The action resolves "latest" through the GitHub API, unauthenticated
          # from a shared runner address, and a run failed with "rate limit
          # exceeded" before it had done anything at all. A token costs nothing
          # and takes the anonymous quota out of the path.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Get the CLI another way if that did not work
        if: steps.cli.outcome != 'success'
        run: |
          # npm rather than the GitHub API: the same binary, fetched from a
          # registry that is not counting anonymous requests per address.
          echo "::warning::supabase/setup-cli failed; installing from npm instead."
          npm i -g supabase@2.122.1
          supabase --version
      - name: Room on the database
        # Run 652 could not push the creature crates: the project refused the
        # first ALTER with "cannot execute ALTER TABLE in a read-only
        # transaction", and nothing in the run said why. A Free Plan project
        # goes read-only when its database passes 500 MB ("Understanding
        # Database and Disk Size", in Supabase's guides), and every push after
        # that fails the same way until something is deleted.
        #
        # So, before anything is pushed: how big the database is, and the
        # biggest things in it, which is how the next one of these gets found
        # in one run rather than three. And when the database is read-only,
        # what that guide says to do about it -- turn the one session
        # read-write and delete -- to the one thing that is safe to delete
        # without asking: pg_cron's log of its own runs, which is what filled
        # it the first time and which nothing reads more than six hours of
        # (20260925134000 has the whole story, and keeps it trimmed from then
        # on). It is emptied rather than deleted from: a delete writes every
        # row it takes out to the WAL, onto a disk that is already full.
        #
        # The platform turns writes back on by itself once the database is
        # under its limit. This waits for that, up to ten minutes, and if it
        # does not come fails the run in plain words, with the biggest things
        # in the database listed, rather than letting the first ALTER say it.
        #
        # And the warning is measured against the limit this project really
        # has. It used to be 400 MB whatever the plan, on the Free Plan's 500,
        # and it fired on every run once the database stood at 1,131 MB and
        # still took writes: a warning that is always there says nothing. A
        # project on a plan with a disk of its own is limited by that disk, and
        # the Management API says how full it is (`config/disk/util`); only a
        # project it says nothing about is held to the Free Plan's line.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          # "Link and push" says what is missing, and is the step that fails for it.
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || exit 0
          supabase link --project-ref "$PROJECT_REF" \
            || { echo "::warning::Could not link to measure the database; pushing without."; exit 0; }
          # `transaction_read_only` is the mode of the transaction asking, so
          # it is what an ALTER from the same place would run into.
          #
          # And whether it is past 400 MB, which is the line that matters to a
          # Free Plan project: it goes read-only at 500, and 400 is early enough
          # to delete something first. See `disk` below for every other plan.
          MODE=$(cat <<'EOSQL'
          select case when current_setting('transaction_read_only') = 'on' then 'READ-ONLY' else 'writable' end as mode,
                 current_user as as_role,
                 pg_size_pretty(pg_database_size(current_database())) as database,
                 case when pg_database_size(current_database()) > 400 * 1024 * 1024
                      then 'PAST-400-MB' else 'under 400 MB' end as room;
          EOSQL
          )
          BIGGEST=$(cat <<'EOSQL'
          select n.nspname || '.' || c.relname as relation,
                 pg_size_pretty(pg_total_relation_size(c.oid)) as total,
                 pg_size_pretty(pg_indexes_size(c.oid)) as indexes,
                 c.reltuples::bigint as rows,
                 coalesce(s.n_dead_tup, 0) as dead
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            left join pg_stat_all_tables s on s.relid = c.oid
           where c.relkind in ('r', 'm')
           order by pg_total_relation_size(c.oid) desc
           limit 20;
          EOSQL
          )
          # The same pattern as the readout below: `db query` sends the SQL to
          # the project's Management API, which runs it as the SQL editor does.
          ask() { supabase db query --linked "$1"; }
          now=$(ask "$MODE" 2>&1) \
            || { echo "$now"; echo "::warning::Could not measure the database; pushing without."; exit 0; }
          echo "$now"
          ask "$BIGGEST" || echo "::warning::Could not list the biggest things in the database."
          # How full the project's own disk is, when it has one. Warned about at
          # four fifths: the disk grows by itself on a plan that lets it, and
          # this is the point to know that it is growing and what is growing it.
          disk=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                   "https://api.supabase.com/v1/projects/$PROJECT_REF/config/disk/util" \
                 | jq -r '.metrics | select(.fs_size_bytes > 0) | "\(.fs_used_bytes) \(.fs_size_bytes)"' 2>/dev/null || true)
          if [ -n "$disk" ]; then
            read -r used size <<< "$disk"
            full=$(( used * 100 / size ))
            echo "The project's disk: $(( used / 1048576 )) MB used of $(( size / 1048576 )) MB, ${full}% full."
            if [ "$full" -ge 80 ]; then
              echo "::warning::The project's disk is ${full}% full: $(( used / 1048576 )) MB of $(( size / 1048576 )) MB. A project whose disk fills goes read-only, and then nothing on the island can be saved. The biggest tables are listed above."
            fi
          elif printf '%s' "$now" | grep -q 'PAST-400-MB'; then
            echo "::warning::The database is past 400 MB. A Free Plan project goes read-only at 500 MB, and then nothing on the island can be saved. The biggest tables are listed above."
          fi
          printf '%s' "$now" | grep -q 'READ-ONLY' || exit 0

          echo "::warning::The database is read-only. Emptying pg_cron's run log to bring it back under its limit."
          # `begin read write` rather than the guide's `set session
          # characteristics`: every statement in one request runs in one
          # transaction, and that one only changes the transactions after it.
          if ! ask "begin read write; set local lock_timeout = '5s'; truncate cron.job_run_details; commit;"; then
            echo "::error::The database is read-only, and pg_cron's run log could not be emptied: the error is above. Nothing can be pushed until the database is back under the plan's limit."
            exit 1
          fi
          ask "$MODE" || true
          for i in $(seq 1 20); do
            sleep 30
            now=$(ask "$MODE" 2>&1) || true
            if ! printf '%s' "$now" | grep -q 'READ-ONLY'; then
              echo "$now"
              echo "Writes are back on, $((i * 30)) seconds after the log was emptied."
              exit 0
            fi
          done
          echo "$now"
          ask "$BIGGEST" || true
          echo "::error::The database is still read-only ten minutes after pg_cron's run log was emptied. Its size is above, with the twenty biggest things in it. Nothing can be pushed until it is back under the plan's limit: something else has to be deleted, or the plan raised."
          exit 1
      - name: Link and push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the 'supabase' environment."
            exit 1
          fi
          supabase --version
          supabase link --project-ref "$PROJECT_REF"
          # What is about to change, before it changes: the newest rows only.
          # The whole list is four hundred and more lines, printed twice, and
          # it pushed everything above it out of reach of a log's tail.
          supabase migration list --linked | tail -12
          # 20260925200618 was a snapshot of the definitions taken from work in
          # progress. It reached the project from a push to a branch other than
          # main, outside this workflow, and never went into main:
          # 20260925205047 carries the whole rulebook in its place. The CLI
          # refuses to push while the project's history names a version the
          # repository does not have, so it comes off that history here. It is
          # a no-op once it has run.
          if [ ! -e supabase/migrations/20260925200618_defs.sql ] \
             && supabase migration list --linked | grep -q 20260925200618; then
            supabase migration repair --status reverted 20260925200618 --linked --yes
          fi
          # `--include-all` because a migration can be *added* out of order
          # even though none is ever edited or renamed: the generated
          # definitions are stamped with the wall clock and the hand-written
          # ones are stamped by hand, and the two clocks are not the same
          # clock. The guard in `rules` is what makes this safe — it refuses a
          # commit that adds a migration sorting before one already in the
          # tree, so anything the CLI would slot in early has been checked.
          supabase db push --include-all
          supabase migration list --linked | tail -12
      - name: The clocks wound as they are written
        # pg_cron's scheduler keeps its own list of jobs and reads `cron.job` again only when told the table changed.
        # A push that changes many functions at once sends more notices than the scheduler reads in a second, so it is
        # told to throw every cache away instead -- and that notice it does not take as "the jobs changed". After the
        # push of 20261103160000 the scheduler went on running world-tick, stock-tick and tree-tick as they were before
        # it, and never started the loops it added: the look of 11-04 00:01 found each job running its old command,
        # and the loop jobs never once run.
        #
        # So, once the push is in and has settled: one unchanged `cron.alter_job` on each job, a small change on its
        # own, which the scheduler reads as one. Then wait until the clock's job is seen running what it is stored as.
        # Allowed to fail without failing the deploy: the clocks still turn on the list the scheduler has.
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sleep 5
          supabase db query --linked "select count(cron.alter_job(j.jobid, active := j.active)) as jobs_touched from cron.job j" \
            || { echo "::warning::Could not touch the cron jobs; the scheduler may be running an old list of them."; exit 0; }
          FRESH=$(cat <<'EOSQL'
          select case when exists (
                   select 1 from cron.job_run_details d join cron.job j on j.jobid = d.jobid
                    where j.jobname = 'world-tick' and d.start_time > now() - interval '3 seconds'
                      and d.command = j.command)
                 then 'the scheduler runs the jobs as stored' else 'not yet' end as clocks
          EOSQL
          )
          for i in $(seq 1 20); do
            sleep 3
            if supabase db query --linked "$FRESH" 2>/dev/null | grep -q 'as stored'; then
              echo "the scheduler runs the jobs as stored (after ${i} looks)"; exit 0
            fi
          done
          echo "::warning::After a minute the scheduler still runs world-tick as it was, not as cron.job stores it."
      - name: Who keeps the islands
        # The Island keeper's tools (20260925234600) open for whoever founded an
        # island, on that island, and for anybody in `private.island_owner`, on
        # every island. This puts the account with the address in the
        # ISLAND_OWNER_EMAIL secret into that table, through supabase/owner.sql,
        # which the rules job runs against a test address first.
        #
        # The address goes to psql as a variable and reaches the database as a
        # quoted literal, so it is never part of any SQL written here. It is
        # never echoed, and what psql prints back is three counts; the log says
        # only whether an account was found. An empty secret adds nobody.
        #
        # Allowed to fail without failing the deploy: the migrations are in by
        # now, and an owner who could not be added this time is added by the
        # next deploy.
        continue-on-error: true
        env:
          ISLAND_OWNER_EMAIL: ${{ secrets.ISLAND_OWNER_EMAIL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          if [ -z "$ISLAND_OWNER_EMAIL" ]; then
            echo "ISLAND_OWNER_EMAIL is empty, so this deploy makes nobody an island owner."
            exit 0
          fi
          # The pooler `supabase link` wrote down in the step above, and then
          # the database's own address, the one the readout below falls back
          # to. The password rides in PGPASSWORD rather than in either address.
          export PGPASSWORD="$SUPABASE_DB_PASSWORD" PGCONNECT_TIMEOUT=20
          urls=""
          if [ -s supabase/.temp/pooler-url ]; then
            urls="$(sed 's/:\[YOUR-PASSWORD\]//' supabase/.temp/pooler-url)"
          fi
          urls="$urls postgresql://postgres@db.$PROJECT_REF.supabase.co:5432/postgres"
          for url in $urls; do
            if said=$(psql "$url" -X -q -t -A -v ON_ERROR_STOP=1 -v email="$ISLAND_OWNER_EMAIL" -f supabase/owner.sql); then
              IFS='|' read -r matched added owners <<< "$said"
              if [ "${matched:-0}" -gt 0 ]; then
                echo "An account has the address in ISLAND_OWNER_EMAIL: ${matched} found, ${added} newly made an island owner. Island owners on the project: ${owners}."
              else
                echo "::warning::No account has the address in ISLAND_OWNER_EMAIL, so no island owner was added. Island owners on the project: ${owners}. Sign up with that address, then deploy again."
              fi
              exit 0
            fi
          done
          echo "::warning::Could not reach the database to add the island owner. The next deploy tries again."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: The builds the island takes
        # The join refuses a build of the site the island does not know, as
        # "Game updated. Reload." (20261026130900). Every build hashes its own
        # scripts and stylesheets (scripts/harden.mjs) into assets/version.json;
        # this hands the island two: the build committed here, and the one this
        # job makes from the same commit, which is what the "Build site"
        # workflow commits and serves if the committed one was out of date.
        # Every other build is retired, and taken for an hour more, so a page
        # open across the deploy keeps playing. A build of a later deploy than
        # any handed over is taken too: Pages serves the new site before this
        # run reaches the island.
        #
        # Allowed to fail without failing the deploy: the island takes every
        # build while it has none, and the last deploy's for an hour after.
        # The list goes to psql as a variable and reaches the database as a
        # quoted literal, as supabase/owner.sql's address does.
        continue-on-error: true
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          set -o pipefail
          pick='select(type == "object" and (.build | type) == "string") | {build, deploy}'
          committed=$(jq -c "$pick" assets/version.json 2>/dev/null || true)
          npx vite build --logLevel warn > vite.log 2>&1 || { tail -20 vite.log; echo "::warning::Could not build the site here; handing over the committed build only."; }
          built=$(jq -c "$pick" dist/assets/version.json 2>/dev/null || true)
          BUILDS=$(printf '%s\n%s\n' "$committed" "$built" | jq -cs 'map(select(. != null)) | unique')
          if [ "$BUILDS" = "[]" ]; then
            echo "::warning::No build hash in assets/version.json or in this job's build, so the island's builds are as they were."
            exit 0
          fi
          export PGPASSWORD="$SUPABASE_DB_PASSWORD" PGCONNECT_TIMEOUT=20
          urls=""
          if [ -s supabase/.temp/pooler-url ]; then
            urls="$(sed 's/:\[YOUR-PASSWORD\]//' supabase/.temp/pooler-url)"
          fi
          urls="$urls postgresql://postgres@db.$PROJECT_REF.supabase.co:5432/postgres"
          for url in $urls; do
            if said=$(psql "$url" -X -q -t -A -v ON_ERROR_STOP=1 -v builds="$BUILDS" -f supabase/build.sql); then
              echo "The island takes $BUILDS, and the last deploy's builds for an hour: ${said} current."
              echo "### Builds the island takes" >> "$GITHUB_STEP_SUMMARY"
              echo "$BUILDS" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::warning::Could not reach the database to hand over the builds. The island takes the last deploy's for an hour, and the next deploy tries again."
      - name: Carry the generator's moves onto islands already founded
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          # When what the generator says about a region changes, an island
          # founded before it holds the old ground. tools/move-ground.ts writes
          # the new ground into each such island once, and `land_move`
          # remembers it, so every later deploy reads that list and nothing
          # else. It goes through psql with the database password, as the
          # steps around it do: the deploy holds no service key.
          set -o pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD" PGCONNECT_TIMEOUT=20
          urls=""
          if [ -s supabase/.temp/pooler-url ]; then
            urls="$(sed 's/:\[YOUR-PASSWORD\]//' supabase/.temp/pooler-url)"
          fi
          export MOVE_DB_URLS="$urls postgresql://postgres@db.$PROJECT_REF.supabase.co:5432/postgres"
          npx esbuild tools/move-ground.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/move-ground.mjs --log-level=error
          node --max-old-space-size=4096 node_modules/.cache/move-ground.mjs | tee move.log
          echo "### Ground moved" >> "$GITHUB_STEP_SUMMARY"
          tail -20 move.log >> "$GITHUB_STEP_SUMMARY"
      - name: What is alive on each island
        # Asked for: "what is the crescent island mob count currently?" — a
        # question nothing in the run could answer, because this is the only
        # job with a line to the project. Reported rather than checked: a count
        # is news and not a rule, so it never fails the run, and the island is
        # only read from.
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          # Say what this CLI can actually do before asking it anything: the
          # name of the subcommand that runs SQL has moved between versions,
          # and the log of a failed guess is worth more than the guess.
          supabase --version
          supabase db --help || true
          # Wild is the only kind the target counts; anything tamed, penned or
          # stored is on top of it. And the island is stocked a block at a time
          # as people walk into it, so `blocks` is how much of it has ever been
          # visited, which is the other half of why a count is what it is.
          #
          # `ceiling` asks `creature_target()` rather than working the same sum
          # out again here. The first cut of this step carried its own copy of
          # the formula and was wrong within the hour, the moment the density
          # was tripled: it went on reporting the old ceiling while the island
          # stocked to the new one. A number worth printing is worth asking for.
          #
          # And the ref and the date, because four of the islands on the
          # project are called Wildermon and a row nobody can tell from another
          # row answers nothing.
          SQL=$(cat <<'EOSQL'
          select w.name as island,
                 left(w.id::text, 8) as ref,
                 to_char(w.made_at, 'MM-DD HH24:MI') as made,
                 w.size,
                 count(*) filter (where c.mode = 'wild') as wild,
                 count(*) filter (where c.mode is not null and c.mode <> 'wild') as kept,
                 (select count(*) from world_stocked s where s.world_id = w.id) as blocks,
                 creature_target(w.id) as ceiling,
                 -- And whether anybody plays it, and when it goes: the same
                 -- `island_goes_at` that `reap_islands` takes them by.
                 w.ready as open,
                 (select count(*) from player p where p.world_id = w.id) as bodies,
                 (select to_char(max(p.seen_at), 'MM-DD HH24:MI') from player p where p.world_id = w.id) as last_seen,
                 coalesce(to_char(island_goes_at(w.id), 'MM-DD HH24:MI'), 'never') as goes
            from world w
            left join creature c on c.world_id = w.id
           group by w.id, w.name, w.size, w.made_at, w.ready
           order by w.made_at, w.name;
          EOSQL
          )
          # Whichever of these this version answers to. None of them is allowed
          # to take the run down with it.
          supabase db query --linked "$SQL" \
            || printf '%s\n' "$SQL" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$SQL" \
            || echo "::warning::Could not read the island; see the CLI's own help above."
          # And what rulebook the island is actually holding, which no run has
          # ever shown either.
          #
          # A green "Link and push" says the files applied. It does not say what
          # is in the tables afterwards, and the difference matters: the
          # definitions migrations empty the rulebook and fill it again, and the
          # one failure mode that would be silent is filling a table that was
          # never emptied. A count that has doubled says so at a glance.
          #
          # It is also the only way to see from a run whether the thing that was
          # just deployed is there. Four deploys in a row failed this afternoon
          # and the only way to know how far each had got was to read the error.
          #
          # It reads `furniture_def.takes` rather than the `crafted` boolean it
          # was written against. That boolean was dropped when the five
          # restricted stores went to one field, and the readout was left
          # pointing at it: run 502 answered `column "crafted" does not exist`
          # and fell through to its warning, so the first deploy this was
          # supposed to describe is the one it could not describe. It is
          # allowed to fail without taking the deploy with it, which is right,
          # and is also exactly how a broken diagnostic stays broken -- so
          # `fussy` and `larder_mats` come with the fix, since a rulebook whose
          # shape changes is the thing this line exists to notice.
          RULES=$(cat <<'EOSQL'
          select (select count(*) from class_def) as trades,
                 (select count(*) from class_node) as nodes,
                 (select count(*) from rite_def) as rites,
                 (select count(*) from school_def) as schools,
                 (select count(*) from spell_def) as spells,
                 (select count(*) from item_def) as things,
                 (select count(*) from item_def where raw) as raw_mats,
                 (select count(*) from recipe) as recipes,
                 (select count(*) from furniture_def) as pieces,
                 (select count(*) from furniture_def where takes is not null) as fussy,
                 (select count(*) from item_def where larder) as larder_mats,
                 (select coalesce(max(heft)::text, 'none')
                    from furniture_def where takes = 'worked') as craft_bin_kg;
          EOSQL
          )
          supabase db query --linked "$RULES" \
            || printf '%s\n' "$RULES" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$RULES" \
            || echo "::warning::Could not read the rulebook. If the tables are missing, the definitions have not landed."
          # And which clocks are actually wound, which no run has ever shown.
          #
          # Both `world-tick` and `stock-tick` are scheduled from a `do` block
          # ending `exception when others then raise notice`. That is
          # deliberate — a project without `pg_cron` is not a failed
          # deployment, and the suite's bare postgres has none — but it means
          # a green migrate job has never been evidence that the jobs exist.
          # Asked after the wildlife for a reason: `blocks` above only grows
          # if something is turning `stock_tick`, and this is the line that
          # says whether anything is.
          #
          # `cron.job` is not there to be read on a project without the
          # extension, so this is allowed to fail the same way the island read
          # is: loudly, in a warning, without taking the deployment with it.
          CLOCKS=$(cat <<'EOSQL'
          select j.jobname, j.schedule, j.active, left(j.command, 32) as runs
            from cron.job j order by j.jobname;
          EOSQL
          )
          supabase db query --linked "$CLOCKS" \
            || printf '%s\n' "$CLOCKS" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$CLOCKS" \
            || echo "::warning::No clocks listed — either pg_cron is not installed on this project or cron.job could not be read. The island's heartbeat and its stocking both depend on it."
          # And what the scheduler actually ran, beside what the job is stored as: the two differ when the scheduler is
          # working from a list it read before a push (see "The clocks wound as they are written").
          RAN=$(cat <<'EOSQL'
          select j.jobname, left(d.command, 50) as ran, d.command = j.command as as_stored, count(*) as runs,
                 to_char(max(d.start_time), 'HH24:MI:SS') as last
            from cron.job_run_details d join cron.job j on j.jobid = d.jobid
           where d.start_time > now() - interval '2 minutes'
           group by 1, 2, 3 order by 1;
          EOSQL
          )
          supabase db query --linked "$RAN" || echo "::warning::Could not read what the clocks ran."

          # `cron.job_run_details` keys on `jobid`, not `jobname` -- the first
          # cut of this asked for `d.jobname` and got `column d.jobname does
          # not exist` three times over, which is how a diagnostic that has
          # never run once tends to go. The join is the whole fix.
          #
          # And how those clocks have actually been getting on, which is the
          # line this step was missing when somebody first said the island had
          # gone slow.
          #
          # Both ticks run every second and both take an advisory lock, so a
          # round that arrives while the last one is still going returns
          # `busy` and costs nothing. That is by design and is not what this
          # is looking for. What it is looking for is a round that *failed*:
          # `cron.job_run_details` keeps the message, and one failing job on a
          # one-second schedule is three and a half thousand errors an hour in
          # the log with no other sign of itself. Grouped, because three
          # thousand copies of one sentence is one fact.
          RUNS=$(cat <<'EOSQL'
          select j.jobname,
                 d.status,
                 count(*) as runs,
                 to_char(max(d.end_time), 'MM-DD HH24:MI') as last_seen,
                 left(coalesce(d.return_message, ''), 120) as said
            from cron.job_run_details d
            join cron.job j on j.jobid = d.jobid
           where d.start_time > now() - interval '6 hours'
           group by j.jobname, d.status, left(coalesce(d.return_message, ''), 120)
           order by d.status <> 'succeeded' desc, count(*) desc
           limit 20;
          EOSQL
          )
          supabase db query --linked "$RUNS" \
            || printf '%s\n' "$RUNS" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$RUNS" \
            || echo "::warning::No clock runs listed — cron.job_run_details could not be read, so a failing heartbeat would be invisible here."
          # And where the time is actually going, when the project keeps the
          # numbers. `pg_stat_statements` is not on every project and is not
          # worth installing from a deploy, so this asks and shrugs.
          SLOW=$(cat <<'EOSQL'
          select left(regexp_replace(s.query, '\s+', ' ', 'g'), 70) as statement,
                 s.calls,
                 round(s.total_exec_time)::bigint as ms_total,
                 round(s.mean_exec_time::numeric, 2) as ms_each
            from pg_stat_statements s
           where s.query not like '%pg_stat_statements%'
           order by s.total_exec_time desc
           limit 12;
          EOSQL
          )
          supabase db query --linked "$SLOW" \
            || printf '%s\n' "$SLOW" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$SLOW" \
            || echo "::notice::No statement timings — pg_stat_statements is not enabled on this project."
          # And which part of a round the time went into, which is the one
          # thing `pg_stat_statements` cannot say: it gives a single mean for
          # `world_tick` and nothing about the four stages inside it. Written
          # by the clock itself, a row a round, kept for an hour.
          TICK=$(cat <<'EOSQL'
          select count(*) as rounds,
                 round(avg(ms)::numeric, 1) as ms_avg,
                 round((percentile_cont(0.5) within group (order by ms))::numeric, 1) as ms_p50,
                 round((percentile_cont(0.95) within group (order by ms))::numeric, 1) as ms_p95,
                 round(max(ms)::numeric, 1) as ms_worst,
                 round(avg((stages->>'settle')::numeric), 1) as settle,
                 round(avg((stages->>'stir')::numeric), 1) as stir,
                 round(avg((stages->>'sweeps')::numeric), 1) as sweeps,
                 round(avg((stages->>'tidy')::numeric), 1) as tidy,
                 round(avg(worlds)::numeric, 2) as worlds
            from tick_time where at > now() - interval '30 minutes';
          EOSQL
          )
          supabase db query --linked "$TICK" \
            || printf '%s\n' "$TICK" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$TICK" \
            || echo "::notice::No round timings yet — tick_time is filled by world_tick, so the first deploy that creates it has nothing to show."
          # And what the clock caught going wrong. A job or a sweep that raises
          # an error no longer fails the round: it is undone, stopped and kept
          # in `private.tick_fault`, one row a fault with how often it came
          # back. Which is also how it would go unnoticed, so here it is.
          FAULTS=$(cat <<'EOSQL'
          select to_char(f.at, 'MM-DD HH24:MI') as first,
                 to_char(f.last_at, 'MM-DD HH24:MI') as last,
                 f.times,
                 coalesce(w.name, '') as island,
                 left(coalesce(f.uid::text, ''), 8) as body,
                 f.stage,
                 coalesce(f.job, '') as job,
                 left(f.error, 100) as error,
                 left(regexp_replace(coalesce(f.context, ''), '\s+', ' ', 'g'), 160) as at_line
            from private.tick_fault f
            left join world w on w.id = f.world_id
           where f.last_at > now() - interval '1 day'
           order by f.last_at desc
           limit 20;
          EOSQL
          )
          supabase db query --linked "$FAULTS" \
            || printf '%s\n' "$FAULTS" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$FAULTS" \
            || echo "::notice::No faults listed — private.tick_fault could not be read."
          # What has gone wrong in players' browsers over the last day, as they
          # reported it (src/net/errors.ts): each message once, with how often,
          # to how many people, and the newest build it happened in. A deploy is
          # the moment somebody is looking, and the moment to see whether the
          # last one broke something nobody mentioned.
          ERRORS=$(cat <<'EOSQL'
          select count(*) as times,
                 count(distinct uid) as people,
                 max(build) as build,
                 to_char(max(at), 'MM-DD HH24:MI') as last,
                 left(message, 140) as message
            from client_error
           where at > now() - interval '1 day'
           group by left(message, 140)
           order by count(*) desc
           limit 15;
          EOSQL
          )
          supabase db query --linked "$ERRORS" \
            || echo "::notice::Could not read what went wrong in browsers."
          # And the room, last, where the tail of a log reaches it: how big the
          # database is after the push, and the ten biggest things in it.
          ROOM=$(cat <<'EOSQL'
          select n.nspname || '.' || c.relname as relation,
                 pg_size_pretty(pg_total_relation_size(c.oid)) as total,
                 c.reltuples::bigint as rows,
                 pg_size_pretty(pg_database_size(current_database())) as database
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
           where c.relkind in ('r', 'm')
           order by pg_total_relation_size(c.oid) desc
           limit 10;
          EOSQL
          )
          supabase db query --linked "$ROOM" \
            || echo "::notice::Could not measure the database."

  found:
    name: Found an island on the project
    if: ${{ !cancelled() && needs.migrate.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.found }}
    needs: migrate
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Work the ground out and hand it over, once
        env:
          ISLAND: ${{ inputs.island_name }}
          SIZE: ${{ inputs.size }}
          SEED: ${{ inputs.seed }}
        run: |
          # `pipefail`, because without it this step reported success while the
          # tool was dying on its second line: a pipeline answers for its last
          # command, and `tee` always succeeds. A founding job that founds
          # nothing and says it worked is worse than one that fails.
          set -o pipefail
          # The one time the land travels. After this nobody downloads it
          # again: a join carries the seed and every browser works out the
          # ground it is standing on. Postgres keeps this copy because the
          # rules are checked against it.
          npx esbuild tools/found-island.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/found.mjs --log-level=error
          node --max-old-space-size=4096 node_modules/.cache/found.mjs \
            --name "$ISLAND" --size "$SIZE" ${SEED:+--seed "$SEED"} | tee found.log
          echo "### The island" >> "$GITHUB_STEP_SUMMARY"
          tail -2 found.log >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    name: Put the island and the browsers back on the same ground
    if: ${{ !cancelled() && needs.migrate.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.live && inputs.reconcile != 'off' }}
    needs: migrate
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read the land, work the same ground out, and say where they differ
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://glebtboagnafcgwjjvfy.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ISLAND: ${{ inputs.island_name }}
          MODE: ${{ inputs.reconcile }}
        run: |
          # The land travelled once. Every browser has worked it out from the
          # seed ever since — with whatever generator it was built with. This
          # compares the island's own copy against what a browser would draw
          # today and, with `write`, puts every disagreement into tile_change,
          # which is the one thing every browser reads on every join.
          set -o pipefail
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set SUPABASE_SERVICE_KEY in the 'AI' environment: this reads and writes land."
            exit 1
          fi
          npx esbuild tools/reconcile-land.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/reconcile.mjs --log-level=error
          node --max-old-space-size=4096 node_modules/.cache/reconcile.mjs \
            --name "$ISLAND" ${MODE:+$([ "$MODE" = write ] && echo --write)} | tee reconcile.log
          echo "### The ground" >> "$GITHUB_STEP_SUMMARY"
          tail -20 reconcile.log >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Play on the real island
    if: ${{ !cancelled() && needs.migrate.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.live }}
    needs: migrate
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Found one, play on it, check it, give it up
        env:
          ISLAND_SIZE: '64'
        run: |
          npx esbuild supabase/test/smoke.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/smoke.mjs --log-level=error
          node node_modules/.cache/smoke.mjs
