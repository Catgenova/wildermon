            --external:typescript --outfile=node_modules/.cache/changetile.mjs --log-level=error
          node node_modules/.cache/changetile.mjs

      - name: Every vessel holds litres, and a liquid is used by the litre
        run: |
          # Asked for: a bucket of 5 L of water down a litre a dough, lye by the
          # litre, L for what a vessel holds. Both sides: litres out of a bucket,
          # a barrel making up the rest, names and weights by the litre, a full
          # bucket for lye, tanning, a drink, a pour.
          npx esbuild supabase/test/litres.ts --bundle --platform=node --format=esm \
            --external:typescript --outfile=node_modules/.cache/litres.mjs --log-level=error
          node node_modules/.cache/litres.mjs

      - name: A mould is the smith's, formed and poured by blacksmithing
        run: |
          # Asked: pouring moulds should give blacksmithing experience, and a
          # mould's QL when formed should be the smith's and not the sand's. A
          # pour on the island taught nothing at all. This asks that every mould
          # is formed by blacksmithing, that QL 1 sand fired by a good smith
          # makes a good mould, and that a pour and an anvil cast teach it.
          npx esbuild supabase/test/moulds.ts --bundle --platform=node --format=esm \
            --external:typescript --outfile=node_modules/.cache/moulds.mjs --log-level=error
          node node_modules/.cache/moulds.mjs

      - name: A vesp tends the hives, as its trade
        run: |
          # Asked: vesp should work beehives as their trade. A vesp had none,
          # so it could not be set to work a deed. This asks that it can, that
          # it goes to a hive and works there bringing nothing home while the
          # hive fills, and that with no hive in reach it says so.
          npx esbuild supabase/test/vesp.ts --bundle --platform=node --format=esm \
            --external:typescript --outfile=node_modules/.cache/vesp.mjs --log-level=error
          node node_modules/.cache/vesp.mjs

      - name: Things of one kind keep one place in a list
        run: |
          # Three nail moulds came out in whatever order the pack was last
          # rearranged in, and every pour rearranged it. Every tie is broken
          # down to the thing itself, so a list is in one order however the
          # pack under it was shuffled.
          npx esbuild supabase/test/order.ts --bundle --platform=node --format=esm \
            --external:typescript --outfile=node_modules/.cache/order.mjs --log-level=error
          node node_modules/.cache/order.mjs

      - name: Flattening wears the shovel, and every job on the ground its tool
        run: |
          # Reported: flattening with two shovels damaged neither. On an island
          # flattening wore no shovel at all, and four more jobs on the ground
          # wore nothing either. This asks that a go at flattening wears the
          # best shovel by a dig's wear on both sides, so two share it, and
          # that every job on the ground with a tool wears it on the island.
          npx esbuild supabase/test/flatten.ts --bundle --platform=node --format=esm \
            --external:typescript --outfile=node_modules/.cache/flatten.mjs --log-level=error
          node node_modules/.cache/flatten.mjs

      - name: Hostile creatures are marked over the trees
        run: |
          # Asked: threats are hard to see in a mess of trees. Every wild
          # creature of a kind that hunts on sight, and anything hunting you,
          # is drawn in red over what is in front of it with a marker over its
          # head; nothing else is, and none of yours. No database.
          npx esbuild supabase/test/threats.ts --bundle --platform=node --format=esm \
            --external:typescript --outfile=node_modules/.cache/threats.mjs --log-level=error
          node node_modules/.cache/threats.mjs

      - name: A wound you point at, and the Health window
        run: |
          # Asked: a Health window where a wound is clicked to be bandaged or
          # treated, clear about what has to be carried. A dressing, the lye
          # and a salve each picked their own wound; an ask may now name one
          # (Target.wound), and that one is treated or the ask refused saying
          # why, in the same words on both sides. And the window's reckoning:
          # what it offers each wound, what it says is carried and how to make
          # what is not, from the recipes.
          npx esbuild supabase/test/health.ts --bundle --platform=node --format=esm \
            --external:typescript --outfile=node_modules/.cache/health.mjs --log-level=error
          node node_modules/.cache/health.mjs

      - name: Building draws on the stores within reach
        run: |
          # Asked: "building a wall or other building actions should also be
          # able to draw materials from wagon or nearby storage within 3 tiles".
          # A wall and a bridge's span are built out of somebody else's wagon
          # two tiles off, refused with stores turned off and with the wagon
          # four tiles off, the same on both sides.
          npx esbuild supabase/test/buildstores.ts --bundle --platform=node --format=esm \
            --external:typescript --outfile=node_modules/.cache/buildstores.mjs --log-level=error
          node node_modules/.cache/buildstores.mjs

      - name: A wall or a floor is built a number of goes at a time
        run: |
          # Asked: "Allow bulk actions when building structures like walls and
          # floors, e.g. build 5 10 25 50". A log wall's row offers its counts;
          # five goes fit five logs, and fifty finish it and stop, on both sides.
          npx esbuild supabase/test/buildcount.ts --bundle --platform=node --format=esm \
            --external:typescript --outfile=node_modules/.cache/buildcount.mjs --log-level=error
          node node_modules/.cache/buildcount.mjs

      - name: The Equipment window's numbers are the fight's own
        run: |
          # Asked: an Equipment window to drag things on and off a figure of
          # you, with every combat number and the skills behind them. Each
          # number it shows is held against the rule that decides it in a
          # fight, each skill's line against the rule at its start and its next
          # level, and putting on and taking off goes through the pack's jobs.
          # No database.
          npx esbuild supabase/test/equipment.ts --bundle --platform=node --format=esm \
            --external:typescript --outfile=node_modules/.cache/equipment.mjs --log-level=error
          node node_modules/.cache/equipment.mjs

      - name: The journal counts only your own work
        run: |
          # Reported: goals ticked off by another player's work, and some that
          # never tick at all. On an island only the island's counts reach the
          # journal and the traps in view are not rolled here; each goal that
          # read the world in view reads a count of its own, noted on the
