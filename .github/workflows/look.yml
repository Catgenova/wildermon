# A look at the live island, and nothing else: what the database is doing now.
#
# Asked about: "The server isnt loading now", with wildermon frozen and workers idle. The Island workflow reports on
# the project only after its whole test suite has run, the better part of an hour, which is no use while the island
# is down. This reads, and writes nothing: whether the database takes writes, how full its disk is, what is running
# and what is waiting on what, the clock's last rounds and failures, the faults it kept, and what browsers reported.
name: Look at the island

on:
  workflow_dispatch:

# Reads the repository and nothing else; the project is reached with the AI environment's secrets.
permissions:
  contents: read

jobs:
  look:
    name: What the live database is doing
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        id: cli
        continue-on-error: true
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Get the CLI another way if that did not work
        if: steps.cli.outcome != 'success'
        run: npm i -g supabase && supabase --version
      - name: Look
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          ask() { echo "== $1"; supabase db query --linked "$2" || echo "::warning::could not read: $1"; }
          disk=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                   "https://api.supabase.com/v1/projects/$PROJECT_REF/config/disk/util" \
                 | jq -r '.metrics | "\(.fs_used_bytes) \(.fs_size_bytes)"' 2>/dev/null || true)
          echo "== disk (used, size in bytes): $disk"
          # The project's own security advisors (the dashboard's Security Advisor), red and yellow only.
          echo "== security advisors (ERROR, WARN)"
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
               "https://api.supabase.com/v1/projects/$PROJECT_REF/advisors/security" \
            | jq -r '.lints[] | select(.level == "ERROR" or .level == "WARN") | [.level, .name, .detail] | @tsv' \
            | sort | uniq -c | sort -rn | head -80 \
            || echo "::warning::could not read the security advisors"
          # Auth settings the advisors judge, and nothing secret: names and switches only.
          echo "== auth settings"
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
               "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            | jq -c '{password_hibp_enabled, password_min_length, password_required_characters, mfa_totp_enroll_enabled,
                      mfa_totp_verify_enabled, mfa_phone_enroll_enabled, mfa_web_authn_enroll_enabled, external_anonymous_users_enabled,
                      security_captcha_enabled, security_captcha_provider, mailer_otp_exp, sms_otp_exp, jwt_exp,
                      rate_limit_anonymous_users, rate_limit_otp, rate_limit_verify, rate_limit_token_refresh, rate_limit_email_sent,
                      sessions_timebox, sessions_inactivity_timeout, refresh_token_rotation_enabled, security_refresh_token_reuse_interval,
                      mailer_autoconfirm, disable_signup}' \
            || echo "::warning::could not read the auth settings"
          ask "mode and size" "select current_setting('transaction_read_only') as read_only,
                 pg_size_pretty(pg_database_size(current_database())) as database, now() as at"
          ask "what is running, longest first" "select pid, state, wait_event_type || ':' || coalesce(wait_event, '') as waiting,
                 round(extract(epoch from now() - xact_start)::numeric, 1) as xact_s,
                 round(extract(epoch from now() - query_start)::numeric, 1) as query_s,
                 usename, left(regexp_replace(query, '\s+', ' ', 'g'), 120) as query
            from pg_stat_activity
           where datname = current_database() and pid <> pg_backend_pid() and state <> 'idle'
           order by xact_start nulls last limit 25"
          ask "who is blocking whom" "select a.pid as waiting, pg_blocking_pids(a.pid) as blocked_by,
                 round(extract(epoch from now() - a.query_start)::numeric, 1) as waited_s,
                 left(regexp_replace(a.query, '\s+', ' ', 'g'), 100) as query
            from pg_stat_activity a where cardinality(pg_blocking_pids(a.pid)) > 0 limit 25"
          ask "connections by state" "select state, usename, count(*) from pg_stat_activity group by 1, 2 order by 3 desc"
          ask "the clock, last 20 runs" "select jobname, status, to_char(start_time, 'HH24:MI:SS') as started,
                 round(extract(epoch from end_time - start_time)::numeric, 2) as secs, left(return_message, 120) as said
            from cron.job_run_details d join cron.job j using (jobid)
           where j.jobname = 'world-tick' order by start_time desc limit 20"
          ask "the clock's failures, last hour" "select status, count(*), left(return_message, 160) as said
            from cron.job_run_details d join cron.job j using (jobid)
           where j.jobname = 'world-tick' and start_time > now() - interval '1 hour' and status <> 'succeeded'
           group by 1, 3 order by 2 desc limit 10"
          ask "rounds, last 15 minutes" "select count(*) as rounds, round(avg(ms)::numeric, 1) as ms_avg, round(max(ms)::numeric, 1) as ms_worst,
                 to_char(max(at), 'HH24:MI:SS') as last from tick_time where at > now() - interval '15 minutes'"
          ask "faults, last 6 hours" "select to_char(f.at, 'MM-DD HH24:MI') as first, to_char(f.last_at, 'MM-DD HH24:MI') as last, f.times,
                 f.stage, coalesce(f.job, '') as job, left(f.error, 120) as error,
                 left(regexp_replace(coalesce(f.context, ''), '\s+', ' ', 'g'), 200) as at_line
            from private.tick_fault f where f.last_at > now() - interval '6 hours' order by f.last_at desc limit 20"
          ask "browser errors, last 6 hours" "select count(*) as times, max(build) as build, to_char(max(at), 'HH24:MI') as last,
                 left(message, 160) as message, left(max(place), 80) as place
            from client_error where at > now() - interval '6 hours' group by left(message, 160) order by 1 desc limit 15"
          ask "the wild, by kind: how many, and how long ago the newest stood up" "select c.species, count(*) as wild,
                 to_char(max(c.born), 'MM-DD HH24:MI') as newest_born, coalesce(max(t.weight), 0) as weight
            from creature c left join wild_table t on t.species = c.species
           where c.mode = 'wild' group by c.species order by 2 desc"
          ask "kinds the wild table can put out that are nowhere in the wild" "select t.species, t.weight
            from wild_table t where not t.monster
             and not exists (select 1 from creature c where c.species = t.species and c.mode = 'wild') order by 2 desc"
          ask "the island's stocked blocks: how many, and when they were last topped up" "select count(*) as blocks,
                 to_char(min(at), 'MM-DD HH24:MI') as oldest, to_char(max(at), 'MM-DD HH24:MI') as newest from world_stocked"
          ask "deed workers by keeper, and how far each is from its keeper's settlement" "select left(c.keeper::text, 8) as keeper, c.id, c.species, c.name, c.phase,
                 round(creature_x(c)::numeric) as x, round(creature_y(c)::numeric) as y, (my_deed(c.world_id, c.keeper)).name as deed,
                 round(greatest(abs(creature_x(c) - (my_deed(c.world_id, c.keeper)).x), abs(creature_y(c) - (my_deed(c.world_id, c.keeper)).y))::numeric) as off_token,
                 workers_on_deed(c.world_id, c.keeper) as counted, worker_cap(c.world_id, c.keeper) as cap
            from creature c where c.mode = 'deed' and c.post is null order by c.keeper, c.id"
          ask "every tame wildermon of a settlement's keeper that is not at work on it: what it is doing and where" "select left(c.keeper::text, 8) as keeper, c.id, c.species, c.name, c.mode, c.phase,
                 round(creature_x(c)::numeric) as x, round(creature_y(c)::numeric) as y,
                 round(greatest(abs(creature_x(c) - (my_deed(c.world_id, c.keeper)).x), abs(creature_y(c) - (my_deed(c.world_id, c.keeper)).y))::numeric) as off_token
            from creature c where c.keeper is not null and c.mode <> 'deed' and c.mode <> 'wild'
             and (my_deed(c.world_id, c.keeper)).name is not null order by c.keeper, c.id limit 40"
          # Asked: "Farce is on my deed trying to join and my totem is gone. Its supposed to be adjacent to my altar."
          ask "settlements within 200 tiles of 2559,3018: where each token stands" "select left(d.founded_by::text, 8) as founder,
                 folk_name(d.world_id, d.founded_by) as by, d.name, d.x, d.y, d.radius, d.level, to_char(d.founded_at, 'YYYY-MM-DD HH24:MI') as founded
            from deed d where abs(d.x - 2559) <= 200 and abs(d.y - 3018) <= 200 order by d.founded_at"
          ask "altars within 200 tiles of 2559,3018" "select p.id, p.kind, p.sub, p.x, p.y from placed p
           where p.sub ilike '%altar%' and abs(p.x - 2559) <= 200 and abs(p.y - 3018) <= 200"
          ask "anything placed on a token tile near 2559,3018" "select d.name, p.id, p.kind, p.sub, p.x, p.y, p.sx, p.sy from deed d
            join placed p on p.world_id = d.world_id and p.x = d.x and p.y = d.y
           where abs(d.x - 2559) <= 200 and abs(d.y - 3018) <= 200"
          ask "Farce: where they stand and which settlements they belong to" "select pl.name, round(pl.x::numeric, 1) as x, round(pl.y::numeric, 1) as y, pl.away,
                 (select string_agg(d.name, ', ') from deed d where d.world_id = pl.world_id and d.founded_by = pl.uid) as founded
            from player pl where pl.name ilike 'farce%'"
          # What rpc_ground's slow half says to Solara's founder, asked as them and always rolled back (the block ends
          # in an exception whatever happens, so nothing it touches is kept).
          ask "Solara's founder: rpc_ground's slow half, rolled back" "do \$\$
            declare u uuid; w uuid; j jsonb;
            begin
              select world_id, founded_by into w, u from deed where name = 'Solara';
              perform set_config('request.jwt.claims', json_build_object('sub', u)::text, true);
              begin
                j := rpc_ground(w, 40, true);
              exception when others then
                raise exception 'GROUND failed: % (%)', sqlerrm, sqlstate;
              end;
              raise exception 'GROUND deed=%, deeds=%', j->'deed', jsonb_array_length(coalesce(j->'deeds', '[]'::jsonb));
            end \$\$"
          ask "Solara's altar baubles as rpc_ground reads them" "select deed_baubles_json(d.world_id, d.founded_by) from deed d where d.name = 'Solara'"
          ask "the watch: open flags, newest first" "select to_char(f.at, 'MM-DD HH24:MI') as at, w.name as island, f.kind,
                 coalesce(folk_name(f.world_id, f.uid), '') as who, left((f.detail - 'key')::text, 200) as detail
            from private.watch_flag f join world w on w.id = f.world_id
           where not f.seen order by f.n desc limit 40"
          ask "biggest tables" "select n.nspname || '.' || c.relname as relation, pg_size_pretty(pg_total_relation_size(c.oid)) as total,
                 c.reltuples::bigint as rows, coalesce(s.n_dead_tup, 0) as dead
            from pg_class c join pg_namespace n on n.oid = c.relnamespace left join pg_stat_all_tables s on s.relid = c.oid
           where c.relkind in ('r', 'm') order by pg_total_relation_size(c.oid) desc limit 8"
          ask "kept wildermon with no post, no settlement to work for, or gone wild with a keeper" "select c.id, c.species, c.name,
                 c.mode, c.post, coalesce(p.name, '?') as keeper, (deed_of(c.world_id, c.keeper)).name as keeper_deed,
                 c.idle_why, to_char(c.settled_at, 'MM-DD HH24:MI') as settled, to_char(c.idle_since, 'MM-DD HH24:MI') as idle_since
            from creature c left join player p on p.world_id = c.world_id and p.uid = c.keeper
           where c.keeper is not null and (c.mode = 'wild'
              or (c.mode = 'deed' and (deed_of(c.world_id, c.keeper)).world_id is null)
              or (c.post is not null and not exists (select 1 from placed q where q.id = c.post)))
           order by p.name, c.id limit 60"
          ask "post messages, last 3 days" "select to_char(e.at, 'MM-DD HH24:MI') as at, coalesce(p.name, '?') as who, left(e.text, 140) as text
            from event e left join player p on p.world_id = e.world_id and p.uid = e.uid
           where e.at > now() - interval '3 days' and (e.text ilike '%post%' or e.text ilike '%comes home%' or e.text ilike '%runs wild%')
           order by e.at desc limit 40"
          ask "stored wildermon no crate holds" "select c.id, c.species, c.name, coalesce(p.name, '?') as keeper,
                 round(c.to_x) as x, round(c.to_y) as y, to_char(c.settled_at, 'MM-DD HH24:MI') as settled
            from creature c left join player p on p.world_id = c.world_id and p.uid = c.keeper
           where c.mode = 'stored'
             and not exists (select 1 from item i where i.world_id = c.world_id and i.creature = c.id)
             and not exists (select 1 from placed q where q.world_id = c.world_id and q.creature = c.id)
           order by p.name, c.id limit 60"
          ask "where the quarra and mola of the settlement keepers are held" "select c.id, c.species, c.name, c.mode, c.phase, c.post,
                 round(c.to_x) as x, round(c.to_y) as y, coalesce(p.name, '?') as keeper,
                 (select i.holder || ':' || coalesce(i.holder_uid::text, '') || ':' || coalesce(i.inside::text, '') from item i
                   where i.world_id = c.world_id and i.creature = c.id limit 1) as in_item,
                 (select q.id from placed q where q.world_id = c.world_id and q.creature = c.id limit 1) as in_placed
            from creature c left join player p on p.world_id = c.world_id and p.uid = c.keeper
           where c.keeper is not null and c.species in ('quarra', 'mola') order by p.name, c.id limit 60"
          ask "where each settlement keeper stands" "select p.name, round(p.x) as x, round(p.y) as y from player p
           where exists (select 1 from deed d where d.world_id = p.world_id and d.founded_by = p.uid)"
