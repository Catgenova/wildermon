# A look at the live island, and nothing else: what the database is doing now.
#
# Asked about: "The server isnt loading now", with wildermon frozen and workers idle. The Island workflow reports on
# the project only after its whole test suite has run, the better part of an hour, which is no use while the island
# is down. This reads, and writes nothing: whether the database takes writes, how full its disk is, what is running
# and what is waiting on what, the clock's last rounds and failures, the faults it kept, and what browsers reported.
name: Look at the island

on:
  workflow_dispatch:

# Reads the repository and nothing else; the project is reached with the AI environment's secrets.
permissions:
  contents: read

jobs:
  look:
    name: What the live database is doing
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        id: cli
        continue-on-error: true
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Get the CLI another way if that did not work
        if: steps.cli.outcome != 'success'
        run: npm i -g supabase && supabase --version
      - name: The front doors, and what the services in front of the database said
        # Asked about: "Players still unable to log in", after "Could not query the database for the schema cache.
        # Retrying." with the database itself answering. Whether Auth and the API answer from outside, with the
        # public key every browser carries, and the last half hour of the API's, Auth's and Postgres's own logs.
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
          PUBLIC_KEY: sb_publishable_10_lQyHkKqBQ9F6rYuJehw_9rNaCtz3
        run: |
          base="https://$PROJECT_REF.supabase.co"
          door() { echo "== $1"; curl -s -m 30 -o body.txt -w "status %{http_code}, %{time_total} s\n" "${@:2}"; head -c 400 body.txt; echo; }
          door "auth health" -H "apikey: $PUBLIC_KEY" "$base/auth/v1/health"
          door "auth settings (public)" -H "apikey: $PUBLIC_KEY" "$base/auth/v1/settings"
          door "the API's root" -H "apikey: $PUBLIC_KEY" "$base/rest/v1/"
          # Past the gateway into PostgREST itself: a table read and a function call as nobody. Refused (401/403/404) is
          # healthy; 503 with PGRST002 is the API without its schema cache, which is what players were shown.
          door "a table through the API, as nobody" -H "apikey: $PUBLIC_KEY" "$base/rest/v1/world?select=id&limit=1"
          door "a function through the API, as nobody" -X POST -H "apikey: $PUBLIC_KEY" -H "Content-Type: application/json" \
            "$base/rest/v1/rpc/rpc_unported" -d '{}'
          door "realtime's door" -H "apikey: $PUBLIC_KEY" "$base/realtime/v1/api/tenants/realtime-dev/health"
          door "an anonymous sign-in's door, refused or not (no body: nothing is made)" -X POST -H "apikey: $PUBLIC_KEY" \
            -H "Content-Type: application/json" "$base/auth/v1/token?grant_type=refresh_token" -d '{"refresh_token":"none"}'
          logs() {
            echo "== $1, last 30 minutes"
            local start end
            start=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ); end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            curl -s -m 60 -G -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs.all" \
              --data-urlencode "sql=$2" --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end" \
              | jq -r '(.result // [])[] | [(.timestamp / 1000000 | strftime("%H:%M:%S")), (.msg // .event_message | tostring | .[0:220])] | @tsv' 2>/dev/null \
              | head -60 || echo "::warning::could not read $1"
          }
          logs "the API (PostgREST)" "select timestamp, event_message as msg from postgrest_logs order by timestamp desc limit 60"
          logs "Auth" "select timestamp, event_message as msg from auth_logs order by timestamp desc limit 60"
          logs "Postgres errors" "select timestamp, event_message as msg from postgres_logs cross join unnest(metadata) m cross join unnest(m.parsed) p where p.error_severity in ('ERROR', 'FATAL', 'PANIC') order by timestamp desc limit 60"
          logs "the edge: status counts by minute" "select timestamp_trunc(timestamp, minute) as timestamp, concat(cast(r.status_code as string), ' x', cast(count(*) as string)) as msg from edge_logs cross join unnest(metadata) m cross join unnest(m.response) r group by 1, r.status_code order by 1 desc limit 60"

      - name: Look
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          ask() { echo "== $1"; supabase db query --linked "$2" || echo "::warning::could not read: $1"; }
          disk=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                   "https://api.supabase.com/v1/projects/$PROJECT_REF/config/disk/util" \
                 | jq -r '.metrics | "\(.fs_used_bytes) \(.fs_size_bytes)"' 2>/dev/null || true)
          echo "== disk (used, size in bytes): $disk"
          # The project's own security advisors (the dashboard's Security Advisor), red and yellow only.
          echo "== security advisors (ERROR, WARN)"
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
               "https://api.supabase.com/v1/projects/$PROJECT_REF/advisors/security" \
            > advisors.json || echo "::warning::could not read the security advisors"
          jq -r '.lints[] | select(.level == "ERROR" or .level == "WARN") | [.level, .name] | @tsv' advisors.json | sort | uniq -c | sort -rn || true
          echo "== security advisors in full, but for the search path one"
          jq -r '.lints[] | select((.level == "ERROR" or .level == "WARN") and .name != "function_search_path_mutable") | [.level, .name, .detail] | @tsv' advisors.json \
            | sort | uniq -c | sort -rn | head -150 || true
          # Auth settings the advisors judge, and nothing secret: names and switches only.
          echo "== auth settings"
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
               "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            | jq -c '{password_hibp_enabled, password_min_length, password_required_characters, mfa_totp_enroll_enabled,
                      mfa_totp_verify_enabled, mfa_phone_enroll_enabled, mfa_web_authn_enroll_enabled, external_anonymous_users_enabled,
                      security_captcha_enabled, security_captcha_provider, mailer_otp_exp, sms_otp_exp, jwt_exp,
                      rate_limit_anonymous_users, rate_limit_otp, rate_limit_verify, rate_limit_token_refresh, rate_limit_email_sent,
                      sessions_timebox, sessions_inactivity_timeout, refresh_token_rotation_enabled, security_refresh_token_reuse_interval,
                      mailer_autoconfirm, disable_signup}' \
            || echo "::warning::could not read the auth settings"
          ask "mode and size" "select current_setting('transaction_read_only') as read_only,
                 pg_size_pretty(pg_database_size(current_database())) as database, now() as at"
          ask "what is running, longest first" "select pid, state, wait_event_type || ':' || coalesce(wait_event, '') as waiting,
                 round(extract(epoch from now() - xact_start)::numeric, 1) as xact_s,
                 round(extract(epoch from now() - query_start)::numeric, 1) as query_s,
                 usename, left(regexp_replace(query, '\s+', ' ', 'g'), 120) as query
            from pg_stat_activity
           where datname = current_database() and pid <> pg_backend_pid() and state <> 'idle'
           order by xact_start nulls last limit 25"
          ask "who is blocking whom" "select a.pid as waiting, pg_blocking_pids(a.pid) as blocked_by,
                 round(extract(epoch from now() - a.query_start)::numeric, 1) as waited_s,
                 left(regexp_replace(a.query, '\s+', ' ', 'g'), 100) as query
            from pg_stat_activity a where cardinality(pg_blocking_pids(a.pid)) > 0 limit 25"
          ask "connections by state" "select state, usename, count(*) from pg_stat_activity group by 1, 2 order by 3 desc"
          ask "the clock, last 20 runs" "select jobname, status, to_char(start_time, 'HH24:MI:SS') as started,
                 round(extract(epoch from end_time - start_time)::numeric, 2) as secs, left(return_message, 120) as said
            from cron.job_run_details d join cron.job j using (jobid)
           where j.jobname = 'world-tick' order by start_time desc limit 20"
          ask "the clock's failures, last hour" "select status, count(*), left(return_message, 160) as said
            from cron.job_run_details d join cron.job j using (jobid)
           where j.jobname = 'world-tick' and start_time > now() - interval '1 hour' and status <> 'succeeded'
           group by 1, 3 order by 2 desc limit 10"
          ask "rounds, last 15 minutes" "select count(*) as rounds, round(avg(ms)::numeric, 1) as ms_avg, round(max(ms)::numeric, 1) as ms_worst,
                 to_char(max(at), 'HH24:MI:SS') as last from tick_time where at > now() - interval '15 minutes'"
          ask "faults, last 6 hours" "select to_char(f.at, 'MM-DD HH24:MI') as first, to_char(f.last_at, 'MM-DD HH24:MI') as last, f.times,
                 f.stage, coalesce(f.job, '') as job, left(f.error, 120) as error,
                 left(regexp_replace(coalesce(f.context, ''), '\s+', ' ', 'g'), 200) as at_line
            from private.tick_fault f where f.last_at > now() - interval '6 hours' order by f.last_at desc limit 20"
          ask "browser errors, last 6 hours" "select count(*) as times, max(build) as build, to_char(max(at), 'HH24:MI') as last,
                 left(message, 160) as message, left(max(place), 80) as place
            from client_error where at > now() - interval '6 hours' group by left(message, 160) order by 1 desc limit 15"
          ask "the wild, by kind: how many, and how long ago the newest stood up" "select c.species, count(*) as wild,
                 to_char(max(c.born), 'MM-DD HH24:MI') as newest_born, coalesce(max(t.weight), 0) as weight
            from creature c left join wild_table t on t.species = c.species
           where c.mode = 'wild' group by c.species order by 2 desc"
          ask "kinds the wild table can put out that are nowhere in the wild" "select t.species, t.weight
            from wild_table t where not t.monster
             and not exists (select 1 from creature c where c.species = t.species and c.mode = 'wild') order by 2 desc"
          ask "the island's stocked blocks: how many, and when they were last topped up" "select count(*) as blocks,
                 to_char(min(at), 'MM-DD HH24:MI') as oldest, to_char(max(at), 'MM-DD HH24:MI') as newest from world_stocked"
          ask "deed workers by keeper, and how far each is from its keeper's settlement" "select left(c.keeper::text, 8) as keeper, c.id, c.species, c.name, c.phase,
                 round(creature_x(c)::numeric) as x, round(creature_y(c)::numeric) as y, (my_deed(c.world_id, c.keeper)).name as deed,
                 round(greatest(abs(creature_x(c) - (my_deed(c.world_id, c.keeper)).x), abs(creature_y(c) - (my_deed(c.world_id, c.keeper)).y))::numeric) as off_token,
                 workers_on_deed(c.world_id, c.keeper) as counted, worker_cap(c.world_id, c.keeper) as cap
            from creature c where c.mode = 'deed' and c.post is null order by c.keeper, c.id"
          ask "every tame wildermon of a settlement's keeper that is not at work on it: what it is doing and where" "select left(c.keeper::text, 8) as keeper, c.id, c.species, c.name, c.mode, c.phase,
                 round(creature_x(c)::numeric) as x, round(creature_y(c)::numeric) as y,
                 round(greatest(abs(creature_x(c) - (my_deed(c.world_id, c.keeper)).x), abs(creature_y(c) - (my_deed(c.world_id, c.keeper)).y))::numeric) as off_token
            from creature c where c.keeper is not null and c.mode <> 'deed' and c.mode <> 'wild'
             and (my_deed(c.world_id, c.keeper)).name is not null order by c.keeper, c.id limit 40"
          # Asked: "Farce is on my deed trying to join and my totem is gone. Its supposed to be adjacent to my altar."
          ask "settlements within 200 tiles of 2559,3018: where each token stands" "select left(d.founded_by::text, 8) as founder,
                 folk_name(d.world_id, d.founded_by) as by, d.name, d.x, d.y, d.radius, d.level, to_char(d.founded_at, 'YYYY-MM-DD HH24:MI') as founded
            from deed d where abs(d.x - 2559) <= 200 and abs(d.y - 3018) <= 200 order by d.founded_at"
          ask "altars within 200 tiles of 2559,3018" "select p.id, p.kind, p.sub, p.x, p.y from placed p
           where p.sub ilike '%altar%' and abs(p.x - 2559) <= 200 and abs(p.y - 3018) <= 200"
          ask "anything placed on a token tile near 2559,3018" "select d.name, p.id, p.kind, p.sub, p.x, p.y, p.sx, p.sy from deed d
            join placed p on p.world_id = d.world_id and p.x = d.x and p.y = d.y
           where abs(d.x - 2559) <= 200 and abs(d.y - 3018) <= 200"
          # Asked: "my mudlet isn't working? clay 5 tiles from totem"
          ask "catgenova's Mudlet line: mode, phase, why idle, where, job" "select c.id, c.species, c.name, c.mode, c.phase, c.post, c.idle_why, c.idle_what,
                 round(extract(epoch from now() - c.idle_since)) as idle_s, round(creature_x(c)::numeric) as x, round(creature_y(c)::numeric) as y,
                 c.job, c.skills->>'digging' as digging, c.carrying
            from creature c join player pl on pl.world_id = c.world_id and pl.uid = c.keeper
           where pl.name = 'catgenova' and c.species in ('noot') order by c.id"
          ask "clay tiles within 12 of Solara's totem: corners' height against the water, soil, passable" "select t.x, t.y, t.x - d.x as dx, t.y - d.y as dy,
                 round(least(land_height(t.world_id, t.x, t.y), land_height(t.world_id, t.x + 1, t.y), land_height(t.world_id, t.x, t.y + 1), land_height(t.world_id, t.x + 1, t.y + 1))::numeric, 1) as low,
                 round(greatest(land_height(t.world_id, t.x, t.y), land_height(t.world_id, t.x + 1, t.y), land_height(t.world_id, t.x, t.y + 1), land_height(t.world_id, t.x + 1, t.y + 1))::numeric, 1) as high,
                 round(water_surface(t.world_id, t.x, t.y)::numeric, 1) as water, passable(t.world_id, t.x, t.y) as passable
            from deed d, lateral (select d.world_id, gx as x, gy as y from generate_series(d.x - 12, d.x + 12) gx, generate_series(d.y - 12, d.y + 12) gy) t
           where d.name = 'Solara' and land_tile(t.world_id, t.x, t.y) = 8 order by 1, 2 limit 60"
          # Asked: "Bridge is completed, but walking on it is bugged. Impossible to walk on or under."
          ask "catgenova's bridges: ends, storeys, height, rise, width, spans done" "select b.id, b.kind, b.ax, b.ay, b.bx, b.by, b.level, b.level_b, b.height, b.rise,
                 b.width, b.side, b.raised, (select count(*) from bridge_span s where s.world_id = b.world_id and s.bridge = b.id) as spans,
                 (select count(*) from bridge_span s where s.world_id = b.world_id and s.bridge = b.id and bill_done(s.needed)) as done,
                 to_char(b.made_at, 'MM-DD HH24:MI') as made
            from bridge b join player pl on pl.world_id = b.world_id and pl.uid = b.made_by
           where pl.name = 'catgenova' and b.kind <> 'aqueduct' order by b.made_at desc limit 6"
          ask "the newest bridge's ends: building, its storeys, top deck, ground height" "select e.which, e.x, e.y, bl.name, bl.levels, bl.deck, top_deck(b.world_id, e.x, e.y) as top_level,
                 round(land_height(b.world_id, e.x, e.y)::numeric, 1) as ground
            from (select b.* from bridge b join player pl on pl.world_id = b.world_id and pl.uid = b.made_by
                   where pl.name = 'catgenova' and b.kind <> 'aqueduct' order by b.made_at desc limit 1) b
            cross join lateral (values ('a', b.ax, b.ay), ('b', b.bx, b.by)) e(which, x, y)
            left join building_tile bt on bt.world_id = b.world_id and bt.x = e.x and bt.y = e.y
            left join building bl on bl.world_id = bt.world_id and bl.id = bt.building"
          ask "catgenova now: where, storey" "select round(pl.x::numeric, 2) as x, round(pl.y::numeric, 2) as y, pl.level, pl.act from player pl where pl.name = 'catgenova'"
          # Asked: "nothing but pathing errors when trying to walk a bridge" (the marble bridge on Solara Manor's storey 4)
          ask "round the bridge, 2571..2581 x 3003..3009: building, floors by storey, top deck" "select t.x, t.y, bt.building,
                 (select string_agg(f.level || ':' || f.kind || case when bill_done(f.needed) then '' else '(plan)' end, ' ' order by f.level)
                    from floor_tile f where f.world_id = d.world_id and f.x = t.x and f.y = t.y) as floors,
                 top_deck(d.world_id, t.x, t.y) as top, bridge_at(d.world_id, t.x, t.y) as deck
            from deed d cross join lateral (select gx as x, gy as y from generate_series(2571, 2581) gx, generate_series(3003, 3009) gy) t
            left join building_tile bt on bt.world_id = d.world_id and bt.x = t.x and bt.y = t.y
           where d.name = 'Solara' and (bt.building is not null or bridge_at(d.world_id, t.x, t.y) is not null) order by t.y, t.x"
          ask "walls on storey 4 (level 3) round the bridge" "select w.x, w.y, w.dir, w.type, w.material, bill_done(w.needed) as done
            from wall w join deed d on d.world_id = w.world_id and d.name = 'Solara'
           where w.level = 3 and w.x between 2571 and 2581 and w.y between 3003 and 3009 order by w.y, w.x, w.dir"
          ask "Solara Manor's two buildings and the ground round them, as one line of JSON" "select 'LAYOUT ' || (jsonb_build_object(
                 'buildings', (select jsonb_agg(to_jsonb(b) - 'world_id' - 'planned_by') from building b where b.world_id = d.world_id and b.id in (5, 6)),
                 'tiles', (select jsonb_agg(jsonb_build_array(t.building, t.x, t.y, t.pier)) from building_tile t where t.world_id = d.world_id and t.building in (5, 6)),
                 'floors', (select jsonb_agg(jsonb_build_array(f.building, f.level, f.x, f.y, f.kind, f.facing, f.material, bill_done(f.needed)))
                              from floor_tile f where f.world_id = d.world_id and f.building in (5, 6)),
                 'walls', (select jsonb_agg(jsonb_build_array(w.building, w.level, w.dir, w.x, w.y, w.type, w.material, bill_done(w.needed), w.lowered))
                              from wall w where w.world_id = d.world_id and w.x between 2560 and 2596 and w.y between 2996 and 3016),
                 'land', (select jsonb_agg(jsonb_build_array(gx, gy, land_height(d.world_id, gx, gy), land_tile(d.world_id, gx, gy)))
                            from generate_series(2560, 2597) gx, generate_series(2996, 3017) gy)))::text
            from deed d where d.name = 'Solara'"
          # Asked: "my wildermon are travelling 200 tiles to eat from my neighbor's deed"
          ask "catgenova's workers and followers more than 20 tiles from Solara's totem: where, doing what, whose ground" "select c.id, c.species, c.name, c.mode, c.phase, c.job, c.post,
                 round(creature_x(c)::numeric) as x, round(creature_y(c)::numeric) as y,
                 round(greatest(abs(creature_x(c) - d.x), abs(creature_y(c) - d.y))::numeric) as off,
                 c.work_x, c.work_y, c.idle_why, round(c.hunger::numeric, 2) as hunger, c.hitched_to,
                 (select o.name from deed o where o.world_id = c.world_id and deed_covers(o, floor(creature_x(c))::int, floor(creature_y(c))::int) limit 1) as on_deed
            from creature c join player pl on pl.world_id = c.world_id and pl.uid = c.keeper
            join deed d on d.world_id = c.world_id and d.founded_by = c.keeper
           where pl.name = 'catgenova' and c.mode in ('deed', 'active')
             and greatest(abs(creature_x(c) - d.x), abs(creature_y(c) - d.y)) > 20 order by off desc limit 40"
          # Asked: "I have sacrificed hundreds of items at the altar and never seen the rare reward."
          ask "the sacrifice rule as the island has it: the soul draw and its chance" "select soul_chance() as chance,
                 position('soul_chance()' in pg_get_functiondef('perform_sacrifice'::regproc)) > 0 as draws_soul,
                 substring(pg_get_functiondef('perform_sacrifice'::regproc) from 'if random\(\)[^\n]*') as the_draw"
          ask "sacrifices and souls said to each player, all time" "select pl.name,
                 count(*) filter (where e.text like 'Sacrificed:%' or e.text like 'You give up the %') as sacrificed,
                 count(*) filter (where e.text like 'Got: % soul.%' or e.text like 'A % mote is left%' or e.text like 'A % soul is left%') as souls,
                 min(e.at)::date as first, max(e.at)::date as last
            from event e join player pl on pl.world_id = e.world_id and pl.uid = e.uid
           where e.text like 'Sacrificed:%' or e.text like 'You give up the %' or e.text like 'Got: % soul.%'
              or e.text like 'A % mote is left%' or e.text like 'A % soul is left%'
           group by pl.name order by 2 desc"
          ask "sacrifices by the journal tally (all time since it was kept), and souls anywhere" "select pl.name, (pl.tally->>'sacrificed')::int as sacrificed,
                 (select coalesce(sum(i.count), 0) from item i where i.world_id = pl.world_id and i.def = 'soul'
                   and (i.holder_uid = pl.uid or i.holder in ('placed', 'crate'))) as souls_anywhere
            from player pl where pl.tally ? 'sacrificed' order by 2 desc"
          ask "souls ever made or used, by the ledger of item ids" "select def, count(*) as rows, sum(count) as n, min(rare), max(rare) from item where def = 'soul' group by def"
          ask "how long the event log keeps lines" "select min(at)::date as oldest, count(*) as lines from event"
          ask "souls held, by player and rarity" "select pl.name, i.rare, sum(i.count) from item i join player pl on pl.world_id = i.world_id and pl.uid = i.holder_uid
           where i.def = 'soul' and i.holder = 'player' group by 1, 2 order by 1, 2"
          # Asked: "Last night I lost 2 chiplings on an island 2000 tiles from my settlement. Return them to my crates."
          ask "catgenova's chiptail line: mode, where, age, crate" "select c.id, c.species, c.name, c.mode, c.phase, c.post, c.hitched_to,
                 round(creature_x(c)::numeric) as x, round(creature_y(c)::numeric) as y, age_of(c.born, old_of(c), age_pace(c)) as age,
                 round(pl.x::numeric) as px, round(pl.y::numeric) as py, companion_of(c.world_id, c.keeper) = c.id as companion
            from creature c join player pl on pl.world_id = c.world_id and pl.uid = c.keeper
           where pl.name = 'catgenova' and c.species = 'quarra' order by c.id"
          ask "catgenova's post and wildermon messages, last 24 hours" "select to_char(e.at, 'MM-DD HH24:MI') as at, e.kind, left(e.text, 160) as text
            from event e join player pl on pl.world_id = e.world_id and pl.uid = e.uid
           where pl.name = 'catgenova' and e.at > now() - interval '24 hours'
             and (e.text like 'Post %' or e.text ilike '%chip%' or e.text ilike '%went wild%') order by e.at"
          ask "catgenova's empty wildermon crates in pack" "select count(*) from item i join player pl on pl.world_id = i.world_id and pl.uid = i.holder_uid
           where pl.name = 'catgenova' and i.holder = 'player' and i.def = 'creature_crate'"
          ask "Farce: where they stand and which settlements they belong to" "select pl.name, round(pl.x::numeric, 1) as x, round(pl.y::numeric, 1) as y, pl.away,
                 (select string_agg(d.name, ', ') from deed d where d.world_id = pl.world_id and d.founded_by = pl.uid) as founded
            from player pl where pl.name ilike 'farce%'"
          # What rpc_ground's slow half says to Solara's founder, asked as them and always rolled back (the block ends
          # in an exception whatever happens, so nothing it touches is kept).
          ask "Solara's founder: rpc_ground's slow half, rolled back" "do \$\$
            declare u uuid; w uuid; j jsonb;
            begin
              select world_id, founded_by into w, u from deed where name = 'Solara';
              perform set_config('request.jwt.claims', json_build_object('sub', u)::text, true);
              begin
                j := rpc_ground(w, 40, true);
              exception when others then
                raise exception 'GROUND failed: % (%)', sqlerrm, sqlstate;
              end;
              raise exception 'GROUND deed=%, deeds=%', j->'deed', jsonb_array_length(coalesce(j->'deeds', '[]'::jsonb));
            end \$\$"
          # Asked about: "Mortarbacks still not working when I log in", their card saying nobody awake is near. A worker's
          # card says that when its turn is half a minute overdue and its keeper is in: the clock is not settling it.
          ask "Solara's keeper's deed workers: turn, phase, job, bed, post" "select c.id, c.species, c.name, c.phase, c.job,
                 round(extract(epoch from now() - c.until)::numeric) as overdue_s, c.bed, c.post, c.hunger,
                 round(creature_x(c)::numeric, 1) as x, round(creature_y(c)::numeric, 1) as y, c.to_x, c.to_y,
                 left(c.skills::text, 60) as skills
            from creature c join deed d on d.founded_by = c.keeper and d.world_id = c.world_id
           where d.name = 'Solara' and c.mode = 'deed' order by c.id"
          ask "and their keeper, as the clock reads who is awake" "select p.name, p.away, round(extract(epoch from now() - p.seen_at)::numeric) as seen_s_ago,
                 idle_logout() as logout_s, p.x, p.y from player p join deed d on d.founded_by = p.uid and d.world_id = p.world_id where d.name = 'Solara'"
          ask "one settle of each, rolled back: what it did" "do \$\$
            declare r record; v_before timestamptz; v_after timestamptz; v_phase text; v_ok boolean; out text := '';
            begin
              for r in select c.id, c.world_id, c.until from creature c join deed d on d.founded_by = c.keeper and d.world_id = c.world_id
                        where d.name = 'Solara' and c.mode = 'deed' order by c.id loop
                begin
                  v_ok := creature_settle(r.world_id, r.id);
                  select until, phase into v_after, v_phase from creature where world_id = r.world_id and id = r.id;
                  out := out || format(' | %s settled=%s until %s -> %s phase %s', r.id, v_ok, to_char(r.until, 'HH24:MI:SS'), to_char(v_after, 'HH24:MI:SS'), v_phase);
                exception when others then
                  out := out || format(' | %s ERROR %s (%s)', r.id, sqlerrm, sqlstate);
                end;
              end loop;
              raise exception 'SETTLE%', out;
            end \$\$"
          ask "Solara's altar baubles as rpc_ground reads them" "select deed_baubles_json(d.world_id, d.founded_by) from deed d where d.name = 'Solara'"
          ask "the watch: open flags, newest first" "select to_char(f.at, 'MM-DD HH24:MI') as at, w.name as island, f.kind,
                 coalesce(folk_name(f.world_id, f.uid), '') as who, left((f.detail - 'key')::text, 200) as detail
            from private.watch_flag f join world w on w.id = f.world_id
           where not f.seen order by f.n desc limit 40"
          ask "biggest tables" "select n.nspname || '.' || c.relname as relation, pg_size_pretty(pg_total_relation_size(c.oid)) as total,
                 c.reltuples::bigint as rows, coalesce(s.n_dead_tup, 0) as dead
            from pg_class c join pg_namespace n on n.oid = c.relnamespace left join pg_stat_all_tables s on s.relid = c.oid
           where c.relkind in ('r', 'm') order by pg_total_relation_size(c.oid) desc limit 8"
          ask "kept wildermon with no post, no settlement to work for, or gone wild with a keeper" "select c.id, c.species, c.name,
                 c.mode, c.post, coalesce(p.name, '?') as keeper, (deed_of(c.world_id, c.keeper)).name as keeper_deed,
                 c.idle_why, to_char(c.settled_at, 'MM-DD HH24:MI') as settled, to_char(c.idle_since, 'MM-DD HH24:MI') as idle_since
            from creature c left join player p on p.world_id = c.world_id and p.uid = c.keeper
           where c.keeper is not null and (c.mode = 'wild'
              or (c.mode = 'deed' and (deed_of(c.world_id, c.keeper)).world_id is null)
              or (c.post is not null and not exists (select 1 from placed q where q.id = c.post)))
           order by p.name, c.id limit 60"
          ask "post messages, last 3 days" "select to_char(e.at, 'MM-DD HH24:MI') as at, coalesce(p.name, '?') as who, left(e.text, 140) as text
            from event e left join player p on p.world_id = e.world_id and p.uid = e.uid
           where e.at > now() - interval '3 days' and (e.text ilike '%post%' or e.text ilike '%comes home%' or e.text ilike '%runs wild%')
           order by e.at desc limit 40"
          ask "stored wildermon no crate holds" "select c.id, c.species, c.name, coalesce(p.name, '?') as keeper,
                 round(c.to_x) as x, round(c.to_y) as y, to_char(c.settled_at, 'MM-DD HH24:MI') as settled
            from creature c left join player p on p.world_id = c.world_id and p.uid = c.keeper
           where c.mode = 'stored'
             and not exists (select 1 from item i where i.world_id = c.world_id and i.creature = c.id)
             and not exists (select 1 from placed q where q.world_id = c.world_id and q.creature = c.id)
           order by p.name, c.id limit 60"
          ask "where the quarra and mola of the settlement keepers are held" "select c.id, c.species, c.name, c.mode, c.phase, c.post,
                 round(c.to_x) as x, round(c.to_y) as y, coalesce(p.name, '?') as keeper,
                 (select i.holder || ':' || coalesce(i.holder_uid::text, '') || ':' || coalesce(i.inside::text, '') from item i
                   where i.world_id = c.world_id and i.creature = c.id limit 1) as in_item,
                 (select q.id from placed q where q.world_id = c.world_id and q.creature = c.id limit 1) as in_placed
            from creature c left join player p on p.world_id = c.world_id and p.uid = c.keeper
           where c.keeper is not null and c.species in ('quarra', 'mola') order by p.name, c.id limit 60"
          ask "where each settlement keeper stands" "select p.name, round(p.x) as x, round(p.y) as y from player p
           where exists (select 1 from deed d where d.world_id = p.world_id and d.founded_by = p.uid)"
          # Asked: why Solara does not reach above 10 fps at any zoom. What stands on and round it, by kind, within
          # its radius and a view's width past it, so the client's frame can be costed against what it draws.
          S="with d as (select world_id, x, y, radius + 24 as r from deed where name ilike 'solara' limit 1)"
          ask "Solara" "select name, x, y, radius, level from deed where name ilike 'solara'"
          ask "Solara: pieces by kind" "$S select p.kind, count(*) as n, count(*) filter (where p.lit) as lit
            from placed p, d where p.world_id = d.world_id and abs(p.x - d.x) <= d.r and abs(p.y - d.y) <= d.r
           group by p.kind order by n desc limit 80"
          ask "Solara: wildermon by mode" "$S select c.mode, count(*) as n, count(distinct c.species) as kinds
            from creature c, d where c.world_id = d.world_id and abs(c.to_x - d.x) <= d.r and abs(c.to_y - d.y) <= d.r
           group by c.mode order by n desc"
          ask "Solara: wildermon by kind" "$S select c.species, count(*) as n from creature c, d
           where c.world_id = d.world_id and abs(c.to_x - d.x) <= d.r and abs(c.to_y - d.y) <= d.r
           group by c.species order by n desc limit 40"
          ask "Solara: building" "$S select (select count(*) from wall w where w.world_id = d.world_id and abs(w.x - d.x) <= d.r and abs(w.y - d.y) <= d.r) as walls,
            (select count(*) from wall w where w.world_id = d.world_id and abs(w.x - d.x) <= d.r and abs(w.y - d.y) <= d.r and w.glass is not null) as glass_walls,
            (select count(*) from floor_tile f where f.world_id = d.world_id and abs(f.x - d.x) <= d.r and abs(f.y - d.y) <= d.r) as floors,
            (select max(f.level) from floor_tile f where f.world_id = d.world_id and abs(f.x - d.x) <= d.r and abs(f.y - d.y) <= d.r) as top_level,
            (select count(*) from foundation f where f.world_id = d.world_id and abs(f.x - d.x) <= d.r and abs(f.y - d.y) <= d.r) as foundations,
            (select count(*) from bridge b where b.world_id = d.world_id and abs(b.ax - d.x) <= d.r and abs(b.ay - d.y) <= d.r) as bridges,
            (select count(*) from crop c where c.world_id = d.world_id and abs(c.x - d.x) <= d.r and abs(c.y - d.y) <= d.r) as crops,
            (select count(*) from crate c where c.world_id = d.world_id and abs(c.x - d.x) <= d.r and abs(c.y - d.y) <= d.r) as crates
           from d"
          ask "Solara: things on the ground" "$S select count(*) as items, count(distinct (i.gx, i.gy)) as tiles, coalesce(sum(i.count), 0) as units
            from item i, d where i.world_id = d.world_id and i.gx is not null
             and abs(i.gx - d.x) <= d.r and abs(i.gy - d.y) <= d.r"
          # Asked: a Whispet and a Sparra on a settlement not sparring. Each Sparra line kept on a settlement, and each of
          # its keeper's guards there: what `spar_may` asks of the guard, and its answer.
          ask "Sparring: each Sparra line on a settlement, and its keeper's guards there" "select s.id as sparra, s.name, s.phase, s.idle_why,
              s.spar_with, s.post, s.carrying is not null as carrying, s.worn as s_worn, round(s.health) as s_health,
              g.id as guard, g.species, g.name as g_name, g.job, g.phase as g_phase, g.post as g_post, g.worn as g_worn,
              g.enemy, g.spar_with as g_spar_with, g.idle_why as g_idle, g.carrying is not null as g_carrying, spar_yielded(g) as g_yielded,
              round(work_range(g)::numeric, 1) as g_range,
              (select round(greatest(abs(ws.x + 0.5 - creature_x(s)), abs(ws.y + 0.5 - creature_y(s)))::numeric, 1) from work_site(s.world_id, s) ws) as s_from_site,
              (select spar_may(s.world_id, g, s, ws.x, ws.y) from work_site(s.world_id, s) ws) as may
             from creature s join species_def sd on sd.id = s.species and sd.style = 'spar'
             left join creature g on g.world_id = s.world_id and g.keeper = s.keeper and g.mode = 'deed' and g.id <> s.id
              and coalesce(g.job, (select x.gathers from species_def x where x.id = g.species)) = 'guard'
            where s.mode = 'deed' order by s.id, g.id"
          ask "Sparring: what each such guard is after, and where" "select g.id as guard, g.species, round(creature_x(g)::numeric, 1) as gx, round(creature_y(g)::numeric, 1) as gy,
              g.until - now() as until_in, g.settled_at, g.hurt_at, g.hurt_by,
              e.id as enemy, e.species as e_species, e.mode as e_mode, e.hitched_to, round(creature_x(e)::numeric, 1) as ex, round(creature_y(e)::numeric, 1) as ey,
              round(e.health) as e_health, e.phase as e_phase, e.until - now() as e_until_in,
              (select round(greatest(abs(creature_x(e) - ws.x), abs(creature_y(e) - ws.y))::numeric, 1) from work_site(g.world_id, g) ws) as e_from_site,
              (select d.radius from my_deed(g.world_id, g.keeper) d) as deed_radius,
              (select fight_target(g.world_id, g.id)).id as target_now
             from creature g left join creature e on e.world_id = g.world_id and e.id = g.enemy
            where g.mode = 'deed' and g.enemy is not null
              and exists (select 1 from creature s join species_def sd on sd.id = s.species and sd.style = 'spar'
                           where s.world_id = g.world_id and s.keeper = g.keeper and s.mode = 'deed')"
          ask "Sparring: what stands between such a guard and what it is after" "select g.id as guard, w.x, w.y, w.dir, w.type, w.material, w.level, w.building
             from creature g join creature e on e.world_id = g.world_id and e.id = g.enemy
             join wall w on w.world_id = g.world_id and w.x between floor(least(creature_x(g), creature_x(e)))::int - 1 and floor(greatest(creature_x(g), creature_x(e)))::int + 2
                        and w.y between floor(least(creature_y(g), creature_y(e)))::int - 1 and floor(greatest(creature_y(g), creature_y(e)))::int + 2
            where g.mode = 'deed' and g.enemy is not null and e.mode = 'wild' order by g.id, w.x, w.y"
          ask "Sparring: line clear between such a guard and what it is after, and each way round" "select g.id as guard,
              line_clear(g.world_id, creature_x(g), creature_y(g), creature_x(e), creature_y(e)) as straight,
              line_clear(g.world_id, creature_x(g), creature_y(g), creature_x(e), creature_y(g)) as along_x,
              line_clear(g.world_id, creature_x(g), creature_y(g), creature_x(g), creature_y(e)) as along_y,
              creature_tile_ok(g.world_id, floor(creature_x(e))::int, floor(creature_y(e))::int) as e_tile_ok,
              (select p.kind || ':' || coalesce(p.sub, '') from placed p where p.world_id = g.world_id and p.x = floor(creature_x(e))::int and p.y = floor(creature_y(e))::int limit 1) as e_on
             from creature g join creature e on e.world_id = g.world_id and e.id = g.enemy where g.mode = 'deed' and e.mode = 'wild'"
          # Asked about: "i am stuck cant go down" (catgenova, mounted or driving on storey 2 of Solara Manor).
          # Where the body is, what it rides or drives, and the storeys' floors and walls round it. Reads only.
          ask "stuck: the body" "select x, y, level, level_h, moved_at from player where name = 'catgenova'"
          ask "stuck: ridden or pulling" "select c.id, c.species, c.rider is not null as ridden, c.hitched_to, creature_x(c) as cx, creature_y(c) as cy
             from creature c join player p on p.world_id = c.world_id and p.name = 'catgenova'
            where c.rider = p.uid or c.hitched_to in (select v.id from placed v where v.world_id = p.world_id and v.driver = p.uid)"
          ask "stuck: driven vehicle" "select v.id, v.sub, v.x, v.y, v.level from placed v join player p on p.world_id = v.world_id and p.name = 'catgenova' where v.driver = p.uid"
          ask "stuck: floors near" "select f.level, f.x, f.y, f.kind, f.facing, f.hand, f.needed = '{}'::jsonb or not exists (select 1 from jsonb_each(f.needed) e where (e.value)::numeric > 0) as done
             from floor_tile f join player p on p.world_id = f.world_id and p.name = 'catgenova'
            where f.x between floor(p.x)::int - 7 and floor(p.x)::int + 7 and f.y between floor(p.y)::int - 7 and floor(p.y)::int + 7 and f.level <= 2
            order by f.level, f.y, f.x"
          ask "stuck: walls near" "select w.level, w.dir, w.x, w.y, w.type from wall w join player p on p.world_id = w.world_id and p.name = 'catgenova'
            where w.x between floor(p.x)::int - 7 and floor(p.x)::int + 8 and w.y between floor(p.y)::int - 7 and floor(p.y)::int + 8 and w.level <= 2
            order by w.level, w.y, w.x, w.dir"
          # Asked about: "my mortarbacks are idle and not working on the floors above them". The keeper's hod
          # carriers, what they say about being idle, and what the island finds for them to do. Reads only.
          ask "hods: the keeper's carriers" "select c.id, c.species, c.mode, c.job, c.idle_why, c.idle_n, c.idle_since, c.carrying,
                 round(creature_x(c)::numeric, 1) as cx, round(creature_y(c)::numeric, 1) as cy, c.work_x, c.work_y
             from creature c join player p on p.world_id = c.world_id and p.name = 'catgenova'
            where c.keeper = p.uid and c.mode = 'deed' and c.species = 'cobbe' order by c.id"
          ask "hods: what wants hod work near the manor" "select * from hod_needing((select world_id from player where name = 'catgenova'), 2585, 3025, 30, null) limit 10"
          ask "hods: the unfinished storey-2 floors" "select f.level, f.x, f.y, f.kind, f.material, f.needed from floor_tile f join player p on p.world_id = f.world_id and p.name = 'catgenova'
            where f.level >= 1 and f.x between 2575 and 2595 and f.y between 3015 and 3035
              and exists (select 1 from jsonb_each(f.needed) e where (e.value)::numeric > 0) order by f.level, f.y, f.x"
          ask "hods: marble brick and mortar in the keeper's settlement stores" "select (s.it).def, sum((s.it).count) as n, bool_or(coalesce((s.it).locked, false)) as any_locked
             from player p cross join lateral deed_store_items(p.world_id, p.uid) s
            where p.name = 'catgenova' and (s.it).def in ('marble_brick', 'mortar', 'marble_shards') group by 1"
          ask "hods: the stocked work the island finds" "select * from hod_needing_stocked((select world_id from player where name = 'catgenova'), (select uid from player where name = 'catgenova'), 2584, 3026, 30)"
          ask "hods: hod work near, any" "select w.kind, w.level, w.x, w.y, w.needed from hod_work((select world_id from player where name = 'catgenova'), 2584, 3026, 30) w limit 15"
          # Asked: "Diagnose why my bastiondrakes aren't building marble walls when I have marble bricks and mortar available".
          # Each carrier's phase and errand now, the keeper's own settlement its stores and work are read off (`my_deed`),
          # and what the island hands a carrier from there, with its own reach. Reads only.
          ask "hods now: each carrier, phase, errand, why idle" "select c.id, c.name, c.phase, c.job, c.idle_why, c.idle_n, to_char(c.idle_since, 'MM-DD HH24:MI') as idle_since,
                 c.carrying->>'def' as holds, (c.carrying->>'count') as n, round(creature_x(c)::numeric, 1) as cx, round(creature_y(c)::numeric, 1) as cy,
                 c.work_x, c.work_y, round(c.to_x::numeric, 1) as to_x, round(c.to_y::numeric, 1) as to_y, work_range(c) as rng, c.worn, round(c.hunger::numeric, 2) as hunger,
                 to_char(c.settled_at, 'HH24:MI:SS') as settled
             from creature c join player p on p.world_id = c.world_id and p.name = 'catgenova'
            where c.keeper = p.uid and c.mode = 'deed' and c.species = 'cobbe' order by c.id"
          ask "hods now: the keeper's own settlement (my_deed) and every one of theirs (deeds_of)" "select 'my_deed' as which, d.name, d.x, d.y, d.radius from player p cross join lateral my_deed(p.world_id, p.uid) d where p.name = 'catgenova'
           union all select 'deeds_of', d.name, d.x, d.y, d.radius from player p cross join lateral deeds_of(p.world_id, p.uid) d where p.name = 'catgenova'"
          ask "hods now: building material in the keeper's settlement stores" "select (s.it).def, sum((s.it).count) as n, count(distinct s.sid) as stores, bool_or(coalesce((s.it).locked, false)) as any_locked
             from player p cross join lateral deed_store_items(p.world_id, p.uid) s
            where p.name = 'catgenova' and (s.it).def in ('marble_brick', 'mortar', 'slate_brick', 'stone_brick', 'plank', 'nail') group by 1 order by 1"
          ask "hods now: planned work in a carrier's reach of the totem, on the keeper's settlement or not" "select w.kind, w.level, w.dir, w.x, w.y, w.needed,
                 on_my_deed(p.world_id, p.uid, w.x, w.y) as on_mine
             from player p cross join lateral my_deed(p.world_id, p.uid) dd
             cross join lateral hod_work(p.world_id, dd.x, dd.y, (select max(work_range(c)) from creature c where c.keeper = p.uid and c.mode = 'deed' and c.species = 'cobbe')) w
            where p.name = 'catgenova' order by w.level, w.y, w.x limit 30"
          ask "hods now: what the island hands a carrier, from the stores and for what it holds" "select 'stocked' as asked, h.* from player p cross join lateral my_deed(p.world_id, p.uid) dd
             cross join lateral hod_needing_stocked(p.world_id, p.uid, dd.x, dd.y, (select max(work_range(c)) from creature c where c.keeper = p.uid and c.mode = 'deed' and c.species = 'cobbe')) h
            where p.name = 'catgenova'
           union all select 'holding marble_brick', h.* from player p cross join lateral my_deed(p.world_id, p.uid) dd
             cross join lateral hod_needing(p.world_id, dd.x, dd.y, (select max(work_range(c)) from creature c where c.keeper = p.uid and c.mode = 'deed' and c.species = 'cobbe'), 'marble_brick', p.uid) h
            where p.name = 'catgenova'
           union all select 'holding mortar', h.* from player p cross join lateral my_deed(p.world_id, p.uid) dd
             cross join lateral hod_needing(p.world_id, dd.x, dd.y, (select max(work_range(c)) from creature c where c.keeper = p.uid and c.mode = 'deed' and c.species = 'cobbe'), 'mortar', p.uid) h
            where p.name = 'catgenova'"
          ask "hods now: the carriers' messages, last 12 hours" "select to_char(e.at, 'MM-DD HH24:MI') as at, left(e.text, 170) as text from event e join player p on p.world_id = e.world_id and p.uid = e.uid
            where p.name = 'catgenova' and e.at > now() - interval '12 hours' and (e.text ilike '%bastiondrake%' or e.text ilike '%mortarback%' or e.text ilike '%brickling%' or e.text ilike '%hod%')
            order by e.at desc limit 25"
          # Asked: "Dowse does not appear to be making nails or giving an error". The keeper's dowse, siffa and ulva,
          # their trade on the island, the anvils and spindles in reach of the token, the lumps in the stores, and
          # what the island would send each to next. Reads only.
          # Asked: "What even needs slate brick on my deed? I didnt intentionally late any slate plans". The planned
          # slate floor at 2580,3027 on level 2 and the hinged wall at 2580,3006: whose building, who planned them,
          # and what else of that building is planned on that level.
          ask "slate: the planned pieces and who planned them" "select 'floor' as what, f.level, f.x, f.y, f.kind, f.material, f.needed, f.total, f.building, b.name as building_name, b.levels, pb.name as building_by, pf.name as planned_by
             from floor_tile f join player p on p.world_id = f.world_id and p.name = 'catgenova' left join building b on b.world_id = f.world_id and b.id = f.building
             left join player pb on pb.world_id = f.world_id and pb.uid = b.planned_by left join player pf on pf.world_id = f.world_id and pf.uid = f.planned_by
            where f.level = 2 and f.x = 2580 and f.y = 3027
           union all
           select 'wall ' || w.type, w.level, w.x, w.y, w.dir, w.material, w.needed, w.total, w.building, b.name, b.levels, pb.name, pw.name
             from wall w join player p on p.world_id = w.world_id and p.name = 'catgenova' left join building b on b.world_id = w.world_id and b.id = w.building
             left join player pb on pb.world_id = w.world_id and pb.uid = b.planned_by left join player pw on pw.world_id = w.world_id and pw.uid = w.planned_by
            where w.level = 2 and w.x = 2580 and w.y = 3006"
          ask "slate: that floor's building, every floor tile by level, kind and material, done or not" "select f.level, f.kind, f.material, count(*) as tiles,
                 count(*) filter (where exists (select 1 from jsonb_each_text(f.needed) e where e.value::numeric > 0)) as unfinished,
                 min(f.x) as x0, max(f.x) as x1, min(f.y) as y0, max(f.y) as y1, string_agg(distinct coalesce(pf.name, '-'), ',') as planned_by
             from floor_tile f join player p on p.world_id = f.world_id and p.name = 'catgenova'
             left join player pf on pf.world_id = f.world_id and pf.uid = f.planned_by
            where f.building = (select f2.building from floor_tile f2 where f2.world_id = f.world_id and f2.level = 2 and f2.x = 2580 and f2.y = 3027)
            group by f.level, f.kind, f.material order by f.level, f.kind, f.material"
          ask "slate: every slate piece planned on the island near Solara, finished or not" "select 'floor' as what, f.level, f.x, f.y, f.kind, f.needed, f.building, pf.name as planned_by
             from floor_tile f join player p on p.world_id = f.world_id and p.name = 'catgenova' left join player pf on pf.world_id = f.world_id and pf.uid = f.planned_by
            where f.material ilike '%slate%' and abs(f.x - 2576) <= 30 and abs(f.y - 3018) <= 30
           union all
           select 'wall ' || w.type, w.level, w.x, w.y, w.dir, w.needed, w.building, pw.name
             from wall w join player p on p.world_id = w.world_id and p.name = 'catgenova' left join player pw on pw.world_id = w.world_id and pw.uid = w.planned_by
            where w.material ilike '%slate%' and abs(w.x - 2576) <= 30 and abs(w.y - 3018) <= 30
            order by 2, 4, 3 limit 40"
          ask "smiths: the trades on the island" "select id, gathers, work_range from species_def where id in ('dowse', 'siffa', 'ulva')"
          ask "smiths: the keeper's dowse, siffa and ulva" "select c.id, c.species, c.mode, c.phase, c.job, c.idle_why, c.idle_n, c.idle_since, c.carrying, c.post,
                 round(extract(epoch from now() - c.until)::numeric) as overdue_s, to_char(c.settled_at, 'HH24:MI:SS') as settled,
                 round(creature_x(c)::numeric, 1) as cx, round(creature_y(c)::numeric, 1) as cy, c.work_x, c.work_y, work_range(c) as rng,
                 left(c.skills::text, 120) as skills
             from creature c join player p on p.world_id = c.world_id and p.name = 'catgenova'
            where c.keeper = p.uid and c.species in ('dowse', 'siffa', 'ulva') order by c.id"
          ask "smiths: anvils and spindles on the keeper's settlement" "select q.id, q.kind, q.sub, q.x, q.y, q.level, d.name as deed,
                 greatest(abs(q.x - d.x), abs(q.y - d.y)) as from_token, on_my_deed(q.world_id, p.uid, q.x, q.y) as on_deed
             from player p join deed d on d.world_id = p.world_id and d.founded_by = p.uid
             join placed q on q.world_id = p.world_id and (q.kind = 'anvil' or (q.kind = 'furniture' and q.sub = 'spindle'))
              and abs(q.x - d.x) <= 80 and abs(q.y - d.y) <= 80
            where p.name = 'catgenova' order by q.kind, q.id"
          ask "smiths: lumps and fibre in the keeper's stores" "select l, stores_count(p.world_id, p.uid, l) as n from player p,
                 unnest(array['iron_lump', 'copper_lump', 'tin_lump', 'zinc_lump', 'lead_lump', 'wool', 'cotton', 'wemp']) l where p.name = 'catgenova'"
          ask "smiths: the dowse's ledger, worn and bed" "select c.id, c.worn, c.bed, c.ledger::text as ledger, c.idle_since, to_char(c.until, 'HH24:MI:SS') as until
             from creature c join player p on p.world_id = c.world_id and p.name = 'catgenova'
            where c.keeper = p.uid and c.species = 'dowse'"
          ask "smiths: nails and ribbons in the keeper's stores, by metal" "select (s.it).def, (s.it).extra, sum((s.it).count) as n
             from player p cross join lateral deed_store_items(p.world_id, p.uid) s
            where p.name = 'catgenova' and (s.it).def in ('nail', 'ribbon', 'iron_lump') group by 1, 2 order by 1, 2"
          # Asked: "Slugember stating idle due to no fuel, not the case". The keeper's stokers, the fuel in their
          # settlement stores by where it is and whether it is locked, and the hearths they tend. Reads only.
          ask "stokers: the keeper's embra" "select c.id, c.name, c.mode, c.phase, c.idle_why, c.idle_n, c.carrying, work_range(c) as rng, left(c.skills::text, 80) as skills
             from creature c join player p on p.world_id = c.world_id and p.name = 'catgenova'
            where c.keeper = p.uid and c.species = 'embra' order by c.id"
          ask "stokers: fuel in the keeper's stores" "select s.kind, (s.it).def, sum((s.it).count) as n, bool_or(coalesce((s.it).locked, false)) as any_locked,
                 count(distinct s.sid) as stores
             from player p cross join lateral deed_store_items(p.world_id, p.uid) s
            where p.name = 'catgenova' and fuel_value((s.it).def) is not null group by 1, 2 order by 1, 2"
          ask "stokers: fuel in crates on the deed, as the old look read it" "select i.def, sum(i.count) as n, bool_or(coalesce(i.locked, false)) as any_locked
             from player p join deed d on d.world_id = p.world_id and d.founded_by = p.uid
             join crate cr on cr.world_id = p.world_id and on_my_deed(p.world_id, p.uid, cr.x, cr.y)
             join item i on i.world_id = cr.world_id and i.crate = cr.id and i.holder = 'crate'
            where p.name = 'catgenova' and fuel_value(i.def) is not null group by 1 order by 1"
          ask "stokers: hearths on the keeper's settlement" "select q.id, q.kind, q.sub, q.x, q.y, round(q.fuel::numeric) as fuel, q.lit,
                 greatest(abs(q.x - d.x), abs(q.y - d.y)) as from_token
             from player p join deed d on d.world_id = p.world_id and d.founded_by = p.uid
             join placed q on q.world_id = p.world_id and on_my_deed(p.world_id, p.uid, q.x, q.y)
              and q.fuel is not null
            where p.name = 'catgenova' order by q.kind, q.id"
          ask "smiths: where the island sends each next" "select c.id, c.species, s.* from creature c join player p on p.world_id = c.world_id and p.name = 'catgenova'
             cross join lateral errand_step(c.world_id, c.id) s
            where c.keeper = p.uid and c.mode = 'deed' and c.species in ('dowse', 'siffa', 'ulva') order by c.id"
