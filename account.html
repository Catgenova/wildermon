  <body>
    <!-- Edit src/account.html, not the generated account.html at the repository root. -->
    <!-- The cove behind the page, drawn by the game's renderer once the form is up (src/landing/backdrop.ts). -->
    <canvas id="cove" aria-hidden="true"></canvas>
    <!-- The box is the Faith window: its slab, frame and niche are painted in by src/landing/faithbox.ts. -->
    <main class="card faith">
      <h1 class="sr-only">Wildermon</h1>
      <!-- Empty but in the creator, which says what it is for here (src/account.ts). -->
      <p class="lede" id="lede"></p>

      <div class="tabs" role="tablist" aria-label="Account">
        <button type="button" id="tab-new" class="tab on" role="tab" aria-selected="true">Make an account</button>
        <button type="button" id="tab-back" class="tab" role="tab" aria-selected="false">I already have one</button>
      </div>

      <form id="form" novalidate autocomplete="on">
        <label for="name">Username</label>
        <input
          id="name" name="username" type="text" autocomplete="username"
          autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20"
          placeholder="Alice" aria-describedby="name-note" />
        <!-- What is wrong with the name, or whether it is taken, as it is typed (src/account.ts). -->
        <p class="note" id="name-note"></p>

        <label for="pw">Password</label>
        <div class="pw">
          <input id="pw" name="password" type="password" autocomplete="new-password" aria-describedby="pw-note" />
          <button type="button" id="peek" aria-label="Show the password">show</button>
        </div>
        <p class="note" id="pw-note"></p>

        <button id="go" type="submit">Make the account</button>
      </form>

      <p id="say" class="say" role="status" aria-live="polite"></p>

      <!-- Two-step sign-in, for whoever is signed in with a name (src/net/mfa.ts). -->
      <section id="mfa" hidden>
        <h2>Two-step sign-in</h2>
        <p class="note" id="mfa-state"></p>
        <div id="mfa-qr" hidden>
          <img id="mfa-img" alt="QR code for an authenticator app" />
          <p class="note">Key: <code id="mfa-secret"></code></p>
        </div>
        <div id="mfa-code-row" hidden>
          <label for="mfa-code">Authenticator code</label>
          <input id="mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" spellcheck="false" />
        </div>
        <div class="mfa-row">
          <button type="button" id="mfa-go">Turn on</button>
          <button type="button" id="mfa-cancel" hidden>Cancel</button>
        </div>
        <p class="say" id="mfa-say" role="status" aria-live="polite"></p>
      </section>

      <!-- Step two. Hidden until there is an account to hang a face on. The
           creator itself is src/ui/creator.ts, put in ahead of the button. The
           game's Settings send people back here, ?look=1, to change their look. -->
      <section id="maker" hidden>
        <button id="ashore" type="button">Step ashore</button>
      </section>

      <p class="fine" id="warn">
        Because there is no address to send anything to, there is no way to send you a
        reset link either. <b>A forgotten password is a lost account.</b> Write it down
        somewhere, or let the browser keep it.
      </p>
      <nav class="papers" aria-label="The island's papers">
        <button type="button" class="paper-open" id="open-privacy">Privacy Policy</button>
        <button type="button" class="paper-open" id="open-rules">Game Rules</button>
      </nav>
    </main>
    <!-- The Privacy Policy and the Game Rules, each opened over the cove in a box like the one above (src/account.ts). -->
    <dialog id="paper" class="paper-veil" aria-labelledby="paper-title">
      <section class="faith paper">
        <div class="win-head">
          <h2 class="win-title" id="paper-title"></h2>
          <button type="button" class="paper-close" id="paper-close" aria-label="Close">&times;</button>
        </div>
        <div class="paper-body" id="paper-body" tabindex="0"></div>
      </section>
    </dialog>
  </body>
